<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vantage Creative Studio</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Calibri, 'Segoe UI', sans-serif; background: #EDF1F5; height: 100vh; overflow: hidden; color: #1E3A5F; font-size: 13px; }
.app-shell { display: flex; flex-direction: column; height: 100vh; }

/* ── Login ── */
#loginScreen { position: fixed; inset: 0; background: #1E3A5F; display: flex; align-items: center; justify-content: center; z-index: 999; }
#loginScreen.hidden { display: none; }
.login-card { background: #fff; border-radius: 14px; padding: 40px 44px; width: 380px; max-width: 92vw; box-shadow: 0 16px 60px rgba(0,0,0,0.35); }
.login-logo { font-size: 22px; font-weight: 700; color: #1E3A5F; margin-bottom: 4px; }
.login-logo span { color: #F97316; }
.login-tagline { font-size: 12px; color: #6B7B8D; margin-bottom: 10px; }
.login-badge { display: inline-block; background: #EDF1F5; color: #6B7B8D; font-size: 10px; font-weight: 600; padding: 3px 9px; border-radius: 4px; margin-bottom: 22px; }
.login-label { font-size: 11px; font-weight: 700; color: #6B7B8D; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 5px; display: block; }
.login-input { width: 100%; padding: 9px 12px; font-size: 13px; border: 1px solid #DDE3EA; border-radius: 7px; font-family: inherit; color: #1E3A5F; margin-bottom: 14px; outline: none; transition: border-color 0.15s; }
.login-input:focus { border-color: #1E3A5F; }
.login-input.error { border-color: #E53935; background: #FFEBEE; }
.login-btn { width: 100%; padding: 10px; font-size: 13px; font-weight: 700; background: #1E3A5F; color: #fff; border: none; border-radius: 7px; cursor: pointer; font-family: inherit; transition: background 0.15s; margin-top: 4px; }
.login-btn:hover { background: #162e4a; }
.login-error { font-size: 12px; color: #E53935; margin-top: 10px; min-height: 18px; text-align: center; }

/* ── Topbar ── */
.topbar { background: #1E3A5F; color: #fff; height: 52px; padding: 0 18px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; gap: 12px; }
.topbar-logo { font-size: 16px; font-weight: 700; white-space: nowrap; }
.topbar-logo span { color: #F97316; }
.topbar-center { display: flex; align-items: center; gap: 10px; }
.role-pill { display: flex; background: rgba(255,255,255,0.12); border-radius: 20px; padding: 3px; }
.role-btn { padding: 5px 16px; font-size: 12px; font-weight: 600; border: none; border-radius: 16px; cursor: pointer; font-family: inherit; background: transparent; color: rgba(255,255,255,0.65); transition: all 0.15s; white-space: nowrap; }
.role-btn.active { background: #fff; color: #1E3A5F; }
.topbar-right { display: flex; align-items: center; gap: 8px; }
.scenario-btn { padding: 5px 11px; font-size: 11px; font-weight: 600; background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.85); border: 1px solid rgba(255,255,255,0.2); border-radius: 5px; cursor: pointer; font-family: inherit; transition: all 0.15s; white-space: nowrap; }
.scenario-btn:hover { background: rgba(255,255,255,0.22); }
.status-badge { background: rgba(255,255,255,0.15); padding: 4px 10px; border-radius: 4px; font-size: 11px; font-weight: 700; white-space: nowrap; }

/* ── Workspace ── */
.workspace { flex: 1; overflow: hidden; display: flex; }

/* ──────────────────────────────────────
   SUPPLIER VIEW
────────────────────────────────────── */
#supplierView { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.step-indicator { display: flex; align-items: center; gap: 0; padding: 0 24px; height: 44px; background: #fff; border-bottom: 1px solid #DDE3EA; flex-shrink: 0; }
.step-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #9BAFBF; font-weight: 500; }
.step-item.active { color: #1E3A5F; font-weight: 700; }
.step-item.done { color: #43A047; }
.step-num { width: 20px; height: 20px; border-radius: 50%; background: #DDE3EA; color: #6B7B8D; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.step-item.active .step-num { background: #1E3A5F; color: #fff; }
.step-item.done .step-num { background: #43A047; color: #fff; }
.step-arrow { margin: 0 10px; color: #DDE3EA; font-size: 14px; }
.sup-body { flex: 1; overflow-y: auto; padding: 24px; }

/* Step 1: Templates */
.templates-header { margin-bottom: 20px; }
.templates-header h2 { font-size: 20px; font-weight: 700; color: #1E3A5F; margin-bottom: 4px; }
.templates-header p { color: #6B7B8D; font-size: 13px; }
.template-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.template-card { background: #fff; border: 1px solid #DDE3EA; border-radius: 10px; padding: 20px; transition: box-shadow 0.15s, border-color 0.15s; }
.template-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.09); border-color: #1E3A5F; }
.template-card-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 8px; }
.template-name { font-size: 15px; font-weight: 700; color: #1E3A5F; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
.badge-green { background: #E8F5E9; color: #2E7D32; }
.badge-orange { background: #FFF3E0; color: #E65100; }
.badge-yellow { background: #FFFDE7; color: #F57F17; }
.badge-red { background: #FFEBEE; color: #C62828; }
.badge-blue { background: #E3F2FD; color: #1565C0; }
.badge-navy { background: #E8EEF5; color: #1E3A5F; }
.badge-gray { background: #F5F5F5; color: #616161; }
.template-desc { font-size: 12px; color: #6B7B8D; margin-bottom: 12px; line-height: 1.5; }
.channel-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 14px; }
.chip { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; background: #EDF1F5; color: #1E3A5F; border: 1px solid #DDE3EA; }
.btn { padding: 8px 16px; font-size: 13px; font-weight: 600; border: none; border-radius: 6px; cursor: pointer; font-family: inherit; transition: all 0.15s; display: inline-flex; align-items: center; gap: 5px; }
.btn-primary { background: #1E3A5F; color: #fff; }
.btn-primary:hover { background: #162e4a; }
.btn-orange { background: #F97316; color: #fff; }
.btn-orange:hover { background: #e05e0a; }
.btn-green { background: #43A047; color: #fff; }
.btn-green:hover { background: #388E3C; }
.btn-yellow { background: #FFA000; color: #fff; }
.btn-yellow:hover { background: #e08c00; }
.btn-red { background: #E53935; color: #fff; }
.btn-red:hover { background: #c62828; }
.btn-ghost { background: transparent; color: #1E3A5F; border: 1px solid #DDE3EA; }
.btn-ghost:hover { background: #EDF1F5; }
.btn-sm { padding: 5px 12px; font-size: 12px; }
.btn-lg { padding: 11px 22px; font-size: 14px; }
.template-supplier { font-size: 11px; color: #9BAFBF; margin-bottom: 14px; }

/* Step 2: Editor */
.editor-breadcrumb { font-size: 12px; color: #9BAFBF; margin-bottom: 18px; display: flex; align-items: center; gap: 6px; }
.editor-breadcrumb a { color: #F97316; cursor: pointer; text-decoration: none; font-weight: 600; }
.editor-breadcrumb a:hover { text-decoration: underline; }
.editor-layout { display: flex; gap: 24px; align-items: flex-start; }
.editor-preview-col { flex: 0 0 50%; }
.editor-form-col { flex: 1; }
.ad-preview-box { width: 300px; height: 250px; background: linear-gradient(135deg, #1E3A5F 0%, #2e5087 100%); border-radius: 8px; overflow: hidden; position: relative; box-shadow: 0 4px 20px rgba(0,0,0,0.2); display: flex; flex-direction: column; }
.ad-preview-bg { position: absolute; inset: 0; background-size: cover; background-position: center; }
.ad-preview-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.45); }
.ad-preview-content { position: relative; z-index: 1; padding: 20px 18px 14px; flex: 1; display: flex; flex-direction: column; }
.ad-preview-headline { font-size: 17px; font-weight: 700; color: #fff; line-height: 1.25; margin-bottom: 7px; word-break: break-word; }
.ad-preview-sub { font-size: 11px; color: rgba(255,255,255,0.82); line-height: 1.4; margin-bottom: 12px; word-break: break-word; }
.ad-preview-cta { display: inline-block; background: #F97316; color: #fff; font-size: 11px; font-weight: 700; padding: 6px 14px; border-radius: 4px; width: fit-content; }
.ad-preview-bar { height: 28px; background: #F97316; display: flex; align-items: center; padding: 0 14px; flex-shrink: 0; }
.ad-preview-bar-logo { font-size: 11px; font-weight: 700; color: #fff; letter-spacing: 0.5px; }
.ad-preview-bar-legal { font-size: 8px; color: rgba(255,255,255,0.7); margin-left: auto; }

.upload-zone { border: 2px dashed #DDE3EA; border-radius: 8px; padding: 18px; text-align: center; cursor: pointer; margin-bottom: 14px; transition: border-color 0.15s, background 0.15s; background: #fafbfc; }
.upload-zone:hover, .upload-zone.drag-over { border-color: #F97316; background: #FFF8F3; }
.upload-zone-icon { font-size: 22px; color: #9BAFBF; margin-bottom: 6px; }
.upload-zone-text { font-size: 12px; color: #6B7B8D; }
.upload-zone-text strong { color: #F97316; cursor: pointer; }
.upload-img-name { font-size: 11px; color: #43A047; margin-top: 5px; }

.form-group { margin-bottom: 14px; }
.form-label { display: flex; align-items: center; justify-content: space-between; font-size: 11px; font-weight: 700; color: #6B7B8D; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 5px; }
.char-counter { font-size: 11px; font-weight: 400; color: #9BAFBF; text-transform: none; letter-spacing: 0; }
.char-counter.warn { color: #E53935; }
.form-input { width: 100%; padding: 8px 11px; font-size: 13px; border: 1px solid #DDE3EA; border-radius: 6px; font-family: inherit; color: #1E3A5F; outline: none; transition: border-color 0.15s; }
.form-input:focus { border-color: #1E3A5F; }
textarea.form-input { resize: vertical; min-height: 60px; }
select.form-input { background: #fff; cursor: pointer; }
.compliance-hint { font-size: 11px; margin-top: 4px; display: flex; align-items: flex-start; gap: 4px; line-height: 1.4; }
.compliance-hint.ok { color: #43A047; }
.compliance-hint.warn { color: #E53935; }
.legal-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #1E3A5F; cursor: pointer; }
.legal-row input[type=checkbox] { width: 15px; height: 15px; accent-color: #1E3A5F; cursor: pointer; }

/* Step 3: Preview */
.preview-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.preview-header h2 { font-size: 18px; font-weight: 700; }
.preview-status-bar { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 6px; margin-bottom: 20px; font-size: 13px; font-weight: 600; }
.preview-status-bar.ok { background: #E8F5E9; color: #2E7D32; }
.preview-status-bar.warn { background: #FFF3E0; color: #E65100; }
.channel-section { margin-bottom: 24px; }
.channel-section-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; padding-bottom: 6px; border-bottom: 2px solid #DDE3EA; }
.channel-section-name { font-size: 14px; font-weight: 700; color: #1E3A5F; }
.channel-count { font-size: 11px; font-weight: 600; background: #EDF1F5; color: #6B7B8D; padding: 2px 7px; border-radius: 10px; }
.sizes-grid { display: flex; flex-wrap: wrap; gap: 12px; }
.size-thumb-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
.size-thumb { background: linear-gradient(135deg, #1E3A5F 0%, #2e5087 100%); border-radius: 4px; overflow: hidden; display: flex; flex-direction: column; position: relative; box-shadow: 0 2px 6px rgba(0,0,0,0.12); flex-shrink: 0; }
.size-thumb-inner { padding: 4px 5px; flex: 1; display: flex; flex-direction: column; }
.size-thumb-hl { font-size: 7px; font-weight: 700; color: #fff; line-height: 1.2; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.size-thumb-sub { font-size: 6px; color: rgba(255,255,255,0.75); margin-top: 2px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.size-thumb-cta { font-size: 6px; font-weight: 700; background: #F97316; color: #fff; padding: 2px 4px; border-radius: 2px; width: fit-content; margin-top: 3px; }
.size-thumb-bar { height: 7px; background: #F97316; flex-shrink: 0; }
.size-thumb-label { font-size: 10px; color: #6B7B8D; text-align: center; }
.size-thumb-dim { font-size: 9px; color: #9BAFBF; text-align: center; }
.compliance-badge { position: absolute; top: 3px; right: 3px; width: 14px; height: 14px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 8px; font-weight: 700; }
.compliance-badge.ok { background: #43A047; color: #fff; }
.compliance-badge.warn { background: #FFA000; color: #fff; }

/* Step 4: Submitted */
.submitted-center { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; text-align: center; }
.submitted-icon { width: 72px; height: 72px; border-radius: 50%; background: #43A047; color: #fff; font-size: 36px; display: flex; align-items: center; justify-content: center; margin-bottom: 18px; box-shadow: 0 4px 18px rgba(67,160,71,0.3); }
.submitted-title { font-size: 22px; font-weight: 700; color: #1E3A5F; margin-bottom: 8px; }
.submitted-sub { font-size: 14px; color: #6B7B8D; margin-bottom: 22px; max-width: 420px; line-height: 1.6; }
.submitted-details { background: #fff; border: 1px solid #DDE3EA; border-radius: 8px; padding: 18px 24px; text-align: left; margin-bottom: 22px; min-width: 360px; }
.submitted-row { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #EDF1F5; font-size: 12px; }
.submitted-row:last-child { border-bottom: none; }
.submitted-row-label { color: #6B7B8D; font-weight: 600; }
.submitted-row-val { color: #1E3A5F; font-weight: 600; text-align: right; max-width: 60%; }

/* ──────────────────────────────────────
   RETAILER VIEW
────────────────────────────────────── */
#retailerView { flex: 1; display: flex; overflow: hidden; }
.ret-queue { width: 30%; min-width: 260px; border-right: 1px solid #DDE3EA; background: #fff; display: flex; flex-direction: column; overflow: hidden; }
.ret-queue-header { padding: 14px 16px 10px; border-bottom: 1px solid #DDE3EA; flex-shrink: 0; }
.ret-queue-header h3 { font-size: 15px; font-weight: 700; margin-bottom: 10px; }
.queue-tabs { display: flex; gap: 0; border: 1px solid #DDE3EA; border-radius: 6px; overflow: hidden; flex-wrap: wrap; }
.qtab { flex: 1; padding: 5px 4px; font-size: 11px; font-weight: 600; border: none; border-right: 1px solid #DDE3EA; background: #F5F7FA; color: #6B7B8D; cursor: pointer; font-family: inherit; transition: all 0.15s; white-space: nowrap; text-align: center; min-width: 50px; }
.qtab:last-child { border-right: none; }
.qtab.active { background: #1E3A5F; color: #fff; }
.qtab-count { display: inline-block; background: rgba(0,0,0,0.12); border-radius: 8px; padding: 0 5px; font-size: 10px; margin-left: 3px; }
.qtab.active .qtab-count { background: rgba(255,255,255,0.2); }
.queue-list { flex: 1; overflow-y: auto; padding: 10px; }
.sub-card { border: 1px solid #DDE3EA; border-radius: 7px; padding: 11px 12px; margin-bottom: 8px; cursor: pointer; transition: all 0.15s; background: #fff; }
.sub-card:hover { border-color: #1E3A5F; }
.sub-card.selected { border-color: #1E3A5F; background: #F0F4F9; box-shadow: 0 0 0 2px rgba(30,58,95,0.12); }
.sub-card-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 4px; }
.sub-card-supplier { font-size: 13px; font-weight: 700; color: #1E3A5F; }
.sub-card-badges { display: flex; gap: 4px; align-items: center; }
.sub-card-template { font-size: 11px; color: #6B7B8D; margin-bottom: 4px; }
.sub-card-meta { display: flex; align-items: center; justify-content: space-between; }
.sub-card-date { font-size: 10px; color: #9BAFBF; }
.sub-card-ai { font-size: 11px; font-weight: 700; }
.sub-card-ai.ok { color: #43A047; }
.sub-card-ai.warn { color: #FFA000; }
.queue-more { font-size: 11px; color: #9BAFBF; text-align: center; padding: 6px 0; font-style: italic; }

.ret-review { flex: 1; background: #EDF1F5; display: flex; flex-direction: column; overflow: hidden; }
.ret-review-inner { flex: 1; overflow-y: auto; padding: 18px; }
.ret-placeholder { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: #9BAFBF; text-align: center; gap: 10px; }
.ret-placeholder-icon { font-size: 40px; }
.ret-review-header { background: #fff; border: 1px solid #DDE3EA; border-radius: 8px; padding: 14px 16px; margin-bottom: 14px; }
.ret-review-sup { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
.ret-review-meta { font-size: 12px; color: #6B7B8D; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.ret-mini-grid { display: flex; flex-wrap: wrap; gap: 8px; }

.ret-actions { width: 30%; min-width: 260px; border-left: 1px solid #DDE3EA; background: #fff; overflow-y: auto; }
.ret-actions-inner { padding: 16px; }
.section-block { margin-bottom: 20px; }
.section-block-header { font-size: 11px; font-weight: 700; color: #6B7B8D; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
.ai-badge-inline { background: #E3F2FD; color: #1565C0; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 3px; }
.compliance-item { display: flex; align-items: flex-start; gap: 6px; font-size: 12px; padding: 4px 0; border-bottom: 1px solid #F5F7FA; line-height: 1.4; }
.compliance-item:last-child { border-bottom: none; }
.ci-icon { font-size: 13px; flex-shrink: 0; margin-top: 1px; }
.ci-icon.ok { color: #43A047; }
.ci-icon.warn { color: #E53935; }
.ci-text { color: #1E3A5F; }
.compliance-banner { padding: 8px 12px; border-radius: 6px; font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 6px; margin-top: 8px; }
.compliance-banner.ok { background: #E8F5E9; color: #2E7D32; }
.compliance-banner.warn { background: #FFF3E0; color: #E65100; }

.manual-check-item { display: flex; align-items: center; gap: 8px; padding: 6px 0; cursor: pointer; border-bottom: 1px solid #F5F7FA; font-size: 12px; }
.manual-check-item:last-child { border-bottom: none; }
.manual-check-item input[type=checkbox] { width: 14px; height: 14px; accent-color: #1E3A5F; cursor: pointer; }

.action-btns { display: flex; flex-direction: column; gap: 8px; }
.inline-input-group { background: #F5F7FA; border-radius: 6px; padding: 10px; margin-top: 6px; display: none; }
.inline-input-group.visible { display: block; }
.inline-textarea { width: 100%; padding: 7px 10px; font-size: 12px; border: 1px solid #DDE3EA; border-radius: 5px; font-family: inherit; resize: none; min-height: 50px; margin-bottom: 8px; }
.tag-pills { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
.tag-pill { padding: 3px 9px; border-radius: 12px; font-size: 11px; font-weight: 600; border: 1px solid #DDE3EA; background: #fff; color: #6B7B8D; cursor: pointer; transition: all 0.15s; }
.tag-pill.selected { background: #F97316; color: #fff; border-color: #F97316; }

/* Atomic diagram */
.atomic-diagram { background: #F5F7FA; border: 1px solid #DDE3EA; border-radius: 8px; padding: 16px; }
.atomic-row { display: flex; align-items: center; justify-content: center; gap: 6px; margin-bottom: 4px; }
.atomic-box { padding: 6px 10px; border-radius: 5px; font-size: 11px; font-weight: 600; text-align: center; white-space: nowrap; }
.atomic-box.master { background: #1E3A5F; color: #fff; padding: 8px 18px; }
.atomic-box.component { background: #E8F5E9; color: #2E7D32; border: 1px solid #A5D6A7; font-size: 10px; }
.atomic-box.channel { background: #FFF3E0; color: #E65100; border: 1px solid #FFCC80; font-size: 10px; }
.atomic-box.output { background: #1E3A5F; color: #fff; padding: 8px 18px; font-size: 12px; }
.atomic-arrow { text-align: center; font-size: 16px; color: #9BAFBF; line-height: 1; margin-bottom: 4px; }

/* Activation dashboard */
.activation-section { background: #F5F7FA; border: 1px solid #DDE3EA; border-radius: 8px; padding: 14px; }
.channel-check-item { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 12px; }
.channel-check-item input[type=checkbox] { width: 14px; height: 14px; accent-color: #F97316; cursor: pointer; }
.date-row { display: flex; gap: 10px; margin: 10px 0; }
.date-group { flex: 1; }
.date-label { font-size: 10px; font-weight: 700; color: #6B7B8D; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 4px; }
.date-input { width: 100%; padding: 6px 8px; font-size: 12px; border: 1px solid #DDE3EA; border-radius: 5px; font-family: inherit; }
.activation-success { background: #E8F5E9; border: 1px solid #A5D6A7; color: #2E7D32; padding: 10px 14px; border-radius: 6px; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px; margin-top: 10px; }
.activated-channels { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }

/* Shared */
.divider { height: 1px; background: #DDE3EA; margin: 14px 0; }

</div><!-- /app-shell -->

<script>
// ════════════════════════════════════════

   aiStatus:'warn', aiIssues:['Superlative detected'], confidence:52, scenario:null},
  {id:'sub_h', supplier:'Samsung', supplierId:'s2', template:'PLA Default', submittedAt:'2026-04-07T10:00:00Z',
   status:'revisions', headline:'Smart Home Hub', subheading:'Connect everything seamlessly', cta:'Learn More',
   aiStatus:'pass', aiIssues:[], confidence:89, scenario:null},
];

// ════════════════════════════════════════
//  STATE
// ════════════════════════════════════════

const state = {
  role: 'supplier',
  supStep: 'templates',
  selectedTemplate: null,
  headline: '',
  subheading: '',
  cta: 'Shop Now',
  includeLegal: true,
  uploadedImage: null,
  generatedSizes: [],
  submissions: SUBMISSIONS.map(s => Object.assign({}, s)),
  selectedSubmissionId: null,
  retTab: 'pending',
  manualChecks: {},
  activatedChannels: [],
  atomicVisible: false,
  changesInputOpen: false,
  rejectInputOpen: false,
  selectedChangeTags: [],
};

// ════════════════════════════════════════
//  UTILS
// ════════════════════════════════════════

function checkCompliance(headline, subheading) {
  const superlatives = ['best','most','only','always','lowest','highest','never','perfect','greatest','#1','number one'];
  const text = (headline + ' ' + subheading).toLowerCase();
  const found = superlatives.filter(s => text.includes(s));
  return { pass: found.length === 0, issues: found.map(s => `Superlative "${s}" requires third-party proof`) };
}

function fmt(isoStr) {
  const d = new Date(isoStr);
  return d.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});
}

function todayStr() {
  return new Date().toISOString().split('T')[0];
}

function thirtyDaysStr() {
  const d = new Date();
  d.setDate(d.getDate() + 30);
  return d.toISOString().split('T')[0];
}

function getSubmission(id) {
  return state.submissions.find(s => s.id === id);
}

function statusBadgeClass(status) {
  return {pending:'badge-orange', approved:'badge-green', rejected:'badge-red', revisions:'badge-yellow'}[status] || 'badge-gray';
}

function statusLabel(status) {
  return {pending:'Pending', approved:'Approved', rejected:'Rejected', revisions:'Revisions'}[status] || status;
}

// ════════════════════════════════════════
//  LOGIN
// ════════════════════════════════════════

function doLogin() {
  const u = document.getElementById('loginUser');
  const p = document.getElementById('loginPass');
  const err = document.getElementById('loginError');
  if (u.value === 'vantage' && p.value === 'pr0t0typ3!') {
    sessionStorage.setItem('cs_auth', '1');
    document.getElementById('loginScreen').classList.add('hidden');
    err.textContent = '';
  } else {
    u.classList.add('error');
    p.classList.add('error');
    err.textContent = 'Invalid credentials';
    setTimeout(() => {
      u.classList.remove('error');
      p.classList.remove('error');
      err.textContent = '';
    }, 1800);
  }
}

// Enter key on login
document.getElementById('loginPass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
document.getElementById('loginUser').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

// ════════════════════════════════════════
//  ROLE / VIEW
// ════════════════════════════════════════

function setRole(role) {
  state.role = role;
  document.getElementById('roleSupBtn').classList.toggle('active', role === 'supplier');
  document.getElementById('roleRetBtn').classList.toggle('active', role === 'retailer');
  document.getElementById('statusTopbar').textContent = role === 'supplier' ? 'Supplier' : 'Retailer Admin';
  document.getElementById('supplierView').classList.toggle('hidden', role !== 'supplier');
  document.getElementById('retailerView').classList.toggle('hidden', role !== 'retailer');
  if (role === 'supplier') renderSupplier();
  if (role === 'retailer') renderRetailer();
}

// ════════════════════════════════════════
//  DEMO SCENARIOS
// ════════════════════════════════════════

function loadScenario(s) {
  if (s === 'a') {
    state.retTab = 'pending';
    state.selectedSubmissionId = 'sub_a';
    state.activatedChannels = [];
    state.atomicVisible = false;
    setRole('retailer');
  } else if (s === 'b') {
    state.retTab = 'pending';
    state.selectedSubmissionId = 'sub_b';
    state.activatedChannels = [];
    state.atomicVisible = false;
    setRole('retailer');
  } else if (s === 'c') {
    state.retTab = 'approved';
    state.selectedSubmissionId = 'sub_c';
    state.atomicVisible = true;
    setRole('retailer');
  }
}

// ════════════════════════════════════════
//  SUPPLIER RENDER
// ════════════════════════════════════════

function renderSupplier() {
  renderStepIndicator();
  const body = document.getElementById('supBody');
  if (state.supStep === 'templates') body.innerHTML = renderTemplates();
  else if (state.supStep === 'editor') body.innerHTML = renderEditor();
  else if (state.supStep === 'preview') body.innerHTML = renderPreview();
  else if (state.supStep === 'submitted') body.innerHTML = renderSubmitted();
  bindSupplierEvents();
}

function renderStepIndicator() {
  const steps = ['Templates','Editor','Preview','Submitted'];
  const keys = ['templates','editor','preview','submitted'];
  const order = keys.indexOf(state.supStep);
  let html = '';
  steps.forEach((name, i) => {
    const done = i < order;
    const active = i === order;
    const cls = done ? 'done' : active ? 'active' : '';
    html += `<div class="step-item ${cls}">
      <div class="step-num">${done ? '✓' : (i+1)}</div>
      <span>${name}</span>
    </div>`;
    if (i < steps.length - 1) html += `<span class="step-arrow">›</span>`;
  });
  document.getElementById('stepIndicator').innerHTML = html;
}

function renderTemplates() {
  const cards = DEMO_TEMPLATES.map(t => `
    <div class="template-card">
      <div class="template-card-header">
        <div class="template-name">${t.name}</div>
        <span class="badge badge-green">Live</span>
      </div>
      <div class="template-supplier">Available to: ${t.supplier}</div>
      <div class="template-desc">${t.description}</div>
      <div class="channel-chips">
        ${t.channels.map(c => `<span class="chip">${c}</span>`).join('')}
      </div>
      <button class="btn btn-primary" onclick="selectTemplate('${t.id}')">Create Ad →</button>
    </div>
  `).join('');
  return `
    <div class="templates-header">
      <h2>Available Templates</h2>
      <p>Choose a retailer-approved template to create your ad creative</p>
    </div>
    <div class="template-grid">${cards}</div>
  `;
}

function selectTemplate(id) {
  state.selectedTemplate = DEMO_TEMPLATES.find(t => t.id === id);
  state.headline = '';
  state.subheading = '';
  state.cta = state.selectedTemplate.constraints.cta[0];
  state.includeLegal = true;
  state.uploadedImage = null;
  state.supStep = 'editor';
  renderSupplier();
}

function renderEditor() {
  const t = state.selectedTemplate;
  const c = t.constraints;
  const compliance = checkCompliance(state.headline, state.subheading);
  const hlLen = state.headline.length;
  const subLen = state.subheading.length;
  const hlNearLimit = hlLen > Math.floor(c.headlineMax * 0.8);
  const subNearLimit = subLen > Math.floor(c.subMax * 0.8);

  const ctaOptions = c.cta.map(opt => `<option value="${opt}" ${state.cta === opt ? 'selected' : ''}>${opt}</option>`).join('');

  return `
    <div class="editor-breadcrumb">
      <a onclick="state.supStep='templates';renderSupplier()">← Templates</a>
      <span>›</span>
      <span>Editor</span>
    </div>
    <div style="margin-bottom:14px;">
      <div style="font-size:17px;font-weight:700;margin-bottom:2px;">${t.name}</div>
      <div style="font-size:12px;color:#6B7B8D;">Fill in your creative details below</div>
    </div>
    <div class="editor-layout">
      <div class="editor-preview-col">
        <div style="font-size:11px;font-weight:700;color:#6B7B8D;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;">Live Preview (300×250)</div>
        <div class="ad-preview-box" id="adPreviewBox">
          ${state.uploadedImage ? `<div class="ad-preview-bg" style="background-image:url('${state.uploadedImage}')"></div><div class="ad-preview-overlay"></div>` : ''}
          <div class="ad-preview-content">
            <div class="ad-preview-headline" id="prevHL">${state.headline || 'Your Headline Here'}</div>
            <div class="ad-preview-sub" id="prevSub">${state.subheading || 'Your subheading goes here with more detail about the offer'}</div>
            <div class="ad-preview-cta" id="prevCta">${state.cta}</div>
          </div>
          <div class="ad-preview-bar">
            <span class="ad-preview-bar-logo">The Home Depot</span>
            ${state.includeLegal ? '<span class="ad-preview-bar-legal">*See terms & conditions</span>' : ''}
          </div>
        </div>
      </div>
      <div class="editor-form-col">
        <!-- Upload zone -->
        <div class="upload-zone" id="uploadZone" onclick="document.getElementById('imgFileInput').click()">
          <div class="upload-zone-icon">🖼</div>
          <div class="upload-zone-text">${state.uploadedImage ? '<strong>Change Image</strong>' : 'Drag & drop or <strong>click to upload</strong>'}</div>
          ${state.uploadedImage ? '<div class="upload-img-name">✓ Image loaded</div>' : '<div style="font-size:11px;color:#9BAFBF;margin-top:3px;">PNG, JPG, GIF up to 10MB</div>'}
        </div>
        <input type="file" id="imgFileInput" accept="image/*" style="display:none">

        <!-- Headline -->
        <div class="form-group">
          <label class="form-label">
            Headline
            <span class="char-counter ${hlNearLimit ? 'warn' : ''}" id="hlCounter">${hlLen}/${c.headlineMax} chars</span>
          </label>
          <input class="form-input" type="text" id="hlInput" maxlength="${c.headlineMax}" value="${escHtml(state.headline)}" placeholder="Enter your headline...">
          <div class="compliance-hint ${compliance.pass ? 'ok' : 'warn'}" id="complianceHint">
            ${compliance.pass ? '✓ Copy looks good — no superlatives detected' : '⚠ ' + compliance.issues.join(' · ')}
          </div>
        </div>

        <!-- Subheading -->
        <div class="form-group">
          <label class="form-label">
            Subheading
            <span class="char-counter ${subNearLimit ? 'warn' : ''}" id="subCounter">${subLen}/${c.subMax} chars</span>
          </label>
          <textarea class="form-input" id="subInput" maxlength="${c.subMax}" placeholder="Enter your subheading...">${escHtml(state.subheading)}</textarea>
        </div>

        <!-- CTA -->
        <div class="form-group">
          <label class="form-label">Call to Action</label>
          <select class="form-input" id="ctaSelect">${ctaOptions}</select>
        </div>

        <!-- Legal -->
        <div class="form-group">
          <label class="legal-row">
            <input type="checkbox" id="legalCheck" ${state.includeLegal ? 'checked' : ''}>
            Include disclaimer / legal copy
          </label>
        </div>

        <div style="margin-top:18px;">
          <button class="btn btn-orange btn-lg" onclick="goToPreview()">Preview All Sizes →</button>
        </div>
      </div>
    </div>
  `;
}

function escHtml(str) {
  return (str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function bindSupplierEvents() {
  if (state.supStep !== 'editor') return;
  const t = state.selectedTemplate;
  const c = t.constraints;

  const hlInput = document.getElementById('hlInput');
  const subInput = document.getElementById('subInput');
  const ctaSelect = document.getElementById('ctaSelect');
  const legalCheck = document.getElementById('legalCheck');
  const imgFileInput = document.getElementById('imgFileInput');
  const uploadZone = document.getElementById('uploadZone');

  if (hlInput) {
    hlInput.addEventListener('input', () => {
      state.headline = hlInput.value;
      const len = state.headline.length;
      const nearLimit = len > Math.floor(c.headlineMax * 0.8);
      const counter = document.getElementById('hlCounter');
      if (counter) { counter.textContent = `${len}/${c.headlineMax} chars`; counter.classList.toggle('warn', nearLimit); }
      // live preview
      const prevHL = document.getElementById('prevHL');
      if (prevHL) prevHL.textContent = state.headline || 'Your Headline Here';
      // compliance hint
      const hint = document.getElementById('complianceHint');
      if (hint) {
        const compliance = checkCompliance(state.headline, state.subheading);
        hint.className = 'compliance-hint ' + (compliance.pass ? 'ok' : 'warn');
        hint.textContent = compliance.pass ? '✓ Copy looks good — no superlatives detected' : '⚠ ' + compliance.issues.join(' · ');
      }
    });
  }

  if (subInput) {
    subInput.addEventListener('input', () => {
      state.subheading = subInput.value;
      const len = state.subheading.length;
      const nearLimit = len > Math.floor(c.subMax * 0.8);
      const counter = document.getElementById('subCounter');
      if (counter) { counter.textContent = `${len}/${c.subMax} chars`; counter.classList.toggle('warn', nearLimit); }
      const prevSub = document.getElementById('prevSub');
      if (prevSub) prevSub.textContent = state.subheading || 'Your subheading goes here with more detail about the offer';
      const hint = document.getElementById('complianceHint');
      if (hint) {
        const compliance = checkCompliance(state.headline, state.subheading);
        hint.className = 'compliance-hint ' + (compliance.pass ? 'ok' : 'warn');
        hint.textContent = compliance.pass ? '✓ Copy looks good — no superlatives detected' : '⚠ ' + compliance.issues.join(' · ');
      }
    });
  }

  if (ctaSelect) {
    ctaSelect.addEventListener('change', () => {
      state.cta = ctaSelect.value;
      const prevCta = document.getElementById('prevCta');
      if (prevCta) prevCta.textContent = state.cta;
    });
  }

  if (legalCheck) {
    legalCheck.addEventListener('change', () => {
      state.includeLegal = legalCheck.checked;
      const bar = document.querySelector('.ad-preview-bar-legal');
      if (state.includeLegal) {
        if (!bar) {
          const barEl = document.querySelector('.ad-preview-bar');
          if (barEl) { const s = document.createElement('span'); s.className = 'ad-preview-bar-legal'; s.textContent = '*See terms & conditions'; barEl.appendChild(s); }
        }
      } else {
        if (bar) bar.remove();
      }
    });
  }

  if (imgFileInput) {
    imgFileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        state.uploadedImage = ev.target.result;
        renderSupplier();
      };
      reader.readAsDataURL(file);
    });
  }

  if (uploadZone) {
    uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('drag-over'); });
    uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag-over'));
    uploadZone.addEventListener('drop', e => {
      e.preventDefault();
      uploadZone.classList.remove('drag-over');
      const file = e.dataTransfer.files[0];
      if (!file || !file.type.startsWith('image/')) return;
      const reader = new FileReader();
      reader.onload = (ev) => { state.uploadedImage = ev.target.result; renderSupplier(); };
      reader.readAsDataURL(file);
    });
  }
}

function goToPreview() {
  state.supStep = 'preview';
  renderSupplier();
}

function renderPreview() {
  const compliance = checkCompliance(state.headline, state.subheading);
  const totalSizes = AD_SPECS.length;
  const flagged = compliance.pass ? 0 : totalSizes;
  const statusBarClass = compliance.pass ? 'ok' : 'warn';
  const statusText = compliance.pass
    ? `✓ ${totalSizes} sizes ready — all sizes passed compliance`
    : `⚠ ${totalSizes} sizes generated — copy issues detected (see warnings below)`;

  // group by channel
  const channels = [...new Set(AD_SPECS.map(s => s.channel))];
  const channelSections = channels.map(ch => {
    const specs = AD_SPECS.filter(s => s.channel === ch);
    const thumbs = specs.map(spec => renderThumb(spec, compliance)).join('');
    return `
      <div class="channel-section">
        <div class="channel-section-header">
          <span class="channel-section-name">${ch}</span>
          <span class="channel-count">${specs.length} size${specs.length > 1 ? 's' : ''}</span>
        </div>
        <div class="sizes-grid">${thumbs}</div>
      </div>
    `;
  }).join('');

  return `
    <div class="editor-breadcrumb">
      <a onclick="state.supStep='templates';renderSupplier()">Templates</a>
      <span>›</span>
      <a onclick="state.supStep='editor';renderSupplier()">Editor</a>
      <span>›</span>
      <span>Preview</span>
    </div>
    <div class="preview-header">
      <h2>18 Ad Sizes — Auto-Generated</h2>
    </div>
    <div class="preview-status-bar ${statusBarClass}">${statusText}</div>
    ${channelSections}
    <div style="display:flex;gap:12px;margin-top:8px;padding-bottom:24px;">
      <button class="btn btn-ghost" onclick="state.supStep='editor';renderSupplier()">← Back to Editor</button>
      <button class="btn btn-orange btn-lg" onclick="submitForApproval()">Submit for Approval →</button>
    </div>
  `;
}

function renderThumb(spec, compliance) {
  // Scale so max dimension is 90px for larger ads, keep proportions
  const MAX = 90;
  const ratio = spec.w / spec.h;
  let tw, th;
  if (ratio >= 1) { tw = MAX; th = Math.max(Math.round(MAX / ratio), 28); }
  else { th = MAX; tw = Math.max(Math.round(MAX * ratio), 28); }

  const hl = state.headline || 'Headline';
  const sub = state.subheading || 'Subheading';
  const cta = state.cta || 'Shop Now';
  const badgeCls = compliance.pass ? 'ok' : 'warn';
  const badgeText = compliance.pass ? '✓' : '!';

  const isWide = ratio > 4;
  const thumbInner = isWide
    ? `<div class="size-thumb-inner" style="flex-direction:row;align-items:center;padding:2px 6px;gap:6px;">
        <div style="flex:1;overflow:hidden;">
          <div class="size-thumb-hl" style="font-size:6px;">${hl}</div>
        </div>
        <div class="size-thumb-cta" style="flex-shrink:0;">${cta}</div>
       </div>
       <div class="size-thumb-bar" style="height:4px;"></div>`
    : `<div class="size-thumb-inner">
        <div class="size-thumb-hl">${hl}</div>
        ${th > 50 ? `<div class="size-thumb-sub">${sub}</div>` : ''}
        ${th > 70 ? `<div class="size-thumb-cta">${cta}</div>` : ''}
       </div>
       <div class="size-thumb-bar"></div>`;

  return `
    <div class="size-thumb-wrap">
      <div class="size-thumb" style="width:${tw}px;height:${th}px;">
        ${thumbInner}
        <div class="compliance-badge ${badgeCls}">${badgeText}</div>
      </div>
      <div class="size-thumb-label">${spec.label}</div>
      <div class="size-thumb-dim">${spec.w}×${spec.h}</div>
    </div>
  `;
}

function submitForApproval() {
  state.supStep = 'submitted';
  renderSupplier();
}

function renderSubmitted() {
  const t = state.selectedTemplate;
  const now = new Date().toLocaleString('en-US', {month:'short',day:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit'});
  return `
    <div class="submitted-center">
      <div class="submitted-icon">✓</div>
      <div class="submitted-title">Creative Submitted for Review</div>
      <div class="submitted-sub">Your creative will be reviewed by Home Depot within 24 hours. You'll receive a notification once a decision has been made.</div>
      <div class="submitted-details">
        <div class="submitted-row">
          <span class="submitted-row-label">Template</span>
          <span class="submitted-row-val">${t ? t.name : '—'}</span>
        </div>
        <div class="submitted-row">
          <span class="submitted-row-label">Headline</span>
          <span class="submitted-row-val">${escHtml(state.headline) || '—'}</span>
        </div>
        <div class="submitted-row">
          <span class="submitted-row-label">Channels</span>
          <span class="submitted-row-val">${t ? t.channels.join(', ') : '—'}</span>
        </div>
        <div class="submitted-row">
          <span class="submitted-row-label">Ad Sizes</span>
          <span class="submitted-row-val">18 sizes</span>
        </div>
        <div class="submitted-row">
          <span class="submitted-row-label">Submitted</span>
          <span class="submitted-row-val">${now}</span>
        </div>
        <div class="submitted-row">
          <span class="submitted-row-label">Status</span>
          <span class="submitted-row-val"><span class="badge badge-orange">Pending Review</span></span>
        </div>
      </div>
      <button class="btn btn-primary btn-lg" onclick="createAnother()">Create Another →</button>
    </div>
  `;
}

function createAnother() {
  state.supStep = 'templates';
  state.selectedTemplate = null;
  state.headline = '';
  state.subheading = '';
  state.cta = 'Shop Now';
  state.includeLegal = true;
  state.uploadedImage = null;
  renderSupplier();
}

// ════════════════════════════════════════
//  RETAILER RENDER
// ════════════════════════════════════════

function renderRetailer() {
  renderQueueTabs();
  renderQueueList();
  renderReviewPanel();
  renderActionsPanel();
}

// TAB COUNTS
const TAB_CONFIG = {
  pending:   { label:'Pending',   total:7,  ids:['sub_a','sub_b','sub_d','sub_e','sub_more1'] },
  approved:  { label:'Approved',  total:45, ids:['sub_c','sub_f'] },
  rejected:  { label:'Rejected',  total:2,  ids:['sub_g'] },
  revisions: { label:'Revisions', total:3,  ids:['sub_h'] },
};

function renderQueueTabs() {
  const tabs = ['pending','approved','rejected','revisions'];
  const html = tabs.map(tab => {
    const cfg = TAB_CONFIG[tab];
    return `<button class="qtab ${state.retTab === tab ? 'active' : ''}" onclick="setRetTab('${tab}')">
      ${cfg.label}<span class="qtab-count">${cfg.total}</span>
    </button>`;
  }).join('');
  document.getElementById('queueTabs').innerHTML = html;
}

function setRetTab(tab) {
  state.retTab = tab;
  state.selectedSubmissionId = null;
  renderQueueTabs();
  renderQueueList();
  renderReviewPanel();
  renderActionsPanel();
}

function renderQueueList() {
  const tabSubs = getTabSubmissions(state.retTab);
  const displayed = tabSubs.items;
  const more = TAB_CONFIG[state.retTab].total - displayed.length;

  const cards = displayed.map(sub => {
    const sel = state.selectedSubmissionId === sub.id;
    const aiBadge = sub.aiStatus === 'pass'
      ? '<span class="sub-card-ai ok">AI ✓</span>'
      : '<span class="sub-card-ai warn">AI ⚠</span>';
    return `
      <div class="sub-card ${sel ? 'selected' : ''}" onclick="selectSub('${sub.id}')">
        <div class="sub-card-top">
          <span class="sub-card-supplier">${sub.supplier}</span>
          <div class="sub-card-badges">
            ${aiBadge}
            <span class="badge ${statusBadgeClass(sub.status)}">${statusLabel(sub.status)}</span>
          </div>
        </div>
        <div class="sub-card-template">${sub.template}</div>
        <div class="sub-card-meta">
          <span class="sub-card-date">${fmt(sub.submittedAt)}</span>
        </div>
      </div>
    `;
  }).join('');

  const moreNote = more > 0 ? `<div class="queue-more">...and ${more} more submission${more !== 1 ? 's' : ''}</div>` : '';

  document.getElementById('queueList').innerHTML = cards + moreNote;
}

function getTabSubmissions(tab) {
  const cfg = TAB_CONFIG[tab];
  const items = cfg.ids.map(id => state.submissions.find(s => s.id === id)).filter(Boolean);
  return { items, total: cfg.total };
}

function selectSub(id) {
  state.selectedSubmissionId = id;
  state.changesInputOpen = false;
  state.rejectInputOpen = false;
  state.selectedChangeTags = [];
  renderQueueList();
  renderReviewPanel();
  renderActionsPanel();
}

function renderReviewPanel() {
  const panel = document.getElementById('reviewPanel');
  if (!state.selectedSubmissionId) {
    panel.innerHTML = `
      <div class="ret-placeholder">
        <div class="ret-placeholder-icon">←</div>
        <div style="font-size:14px;font-weight:600;">Select a submission to review</div>
        <div style="font-size:12px;">Choose a submission from the queue on the left</div>
      </div>`;
    return;
  }

  const sub = getSubmission(state.selectedSubmissionId);
  if (!sub) return;

  const compliance = checkCompliance(sub.headline, sub.subheading);
  const fakeSizes = AD_SPECS.slice(0, 9); // show first 9 as mini grid

  const miniThumbs = AD_SPECS.map(spec => {
    const ratio = spec.w / spec.h;
    const MAX = 54;
    let tw, th;
    if (ratio >= 1) { tw = MAX; th = Math.max(Math.round(MAX / ratio), 16); }
    else { th = MAX; tw = Math.max(Math.round(MAX * ratio), 16); }
    const pass = sub.aiStatus === 'pass';
    return `
      <div style="display:flex;flex-direction:column;align-items:center;gap:2px;">
        <div style="width:${tw}px;height:${th}px;background:linear-gradient(135deg,#1E3A5F 0%,#2e5087 100%);border-radius:3px;position:relative;overflow:hidden;flex-shrink:0;">
          <div style="padding:2px 3px;font-size:5px;color:#fff;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${sub.headline}</div>
          <div style="position:absolute;bottom:0;left:0;right:0;height:${Math.max(4,Math.round(th*0.12))}px;background:#F97316;"></div>
          <div style="position:absolute;top:2px;right:2px;width:10px;height:10px;border-radius:50%;background:${pass?'#43A047':'#FFA000'};font-size:7px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;">${pass?'✓':'!'}</div>
        </div>
        <div style="font-size:8px;color:#9BAFBF;text-align:center;max-width:${tw}px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${spec.w}×${spec.h}</div>
      </div>
    `;
  }).join('');

  panel.innerHTML = `
    <div class="ret-review-header">
      <div class="flex-between" style="margin-bottom:6px;">
        <div class="ret-review-sup">${sub.supplier}</div>
        <span class="badge ${statusBadgeClass(sub.status)}">${statusLabel(sub.status)}</span>
      </div>
      <div class="ret-review-meta">
        <span><strong>Template:</strong> ${sub.template}</span>
        <span><strong>Submitted:</strong> ${fmt(sub.submittedAt)}</span>
        <span><strong>CTA:</strong> ${sub.cta}</span>
      </div>
      <div style="margin-top:10px;background:#1E3A5F;border-radius:6px;padding:12px 14px;color:#fff;">
        <div style="font-size:14px;font-weight:700;margin-bottom:3px;">"${escHtml(sub.headline)}"</div>
        <div style="font-size:12px;opacity:0.8;">${escHtml(sub.subheading)}</div>
      </div>
    </div>

    <div style="font-size:11px;font-weight:700;color:#6B7B8D;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;">All 18 Ad Sizes</div>
    <div class="ret-mini-grid">${miniThumbs}</div>
  `;
}

function renderActionsPanel() {
  const panel = document.getElementById('actionsPanel');
  if (!state.selectedSubmissionId) {
    panel.innerHTML = `<div class="ret-placeholder" style="height:200px;"><div style="font-size:28px;">⚙</div><div style="font-size:12px;">Select a submission</div></div>`;
    return;
  }

  const sub = getSubmission(state.selectedSubmissionId);
  if (!sub) return;

  const manualIds = ['logo','imagery','cta','brand','pricing'];
  const manualLabels = {
    logo: 'Logo quality acceptable',
    imagery: 'Imagery matches campaign theme',
    cta: 'CTA clear and compelling',
    brand: 'No competing brand mentions',
    pricing: 'Pricing/offer is accurate',
  };

  const complianceItems = [
    {icon: sub.aiStatus === 'pass' ? 'ok' : 'ok', text: 'Logo placement: Detected, compliant'},
    {icon: 'ok', text: 'Text overlay: Readable, correct positioning'},
    {icon: 'ok', text: 'Brand colors: Within HD palette'},
    {icon: sub.aiStatus === 'pass' ? 'ok' : 'warn',
     text: sub.aiStatus === 'pass'
       ? `Copy tone: Matches HD voice (${sub.confidence}%)`
       : `Copy tone: Issues detected (${sub.confidence}% confidence)`},
    {icon: 'ok', text: 'Legal disclaimer: Present and formatted correctly'},
    ...sub.aiIssues.map(issue => ({icon: 'warn', text: issue})),
  ];

  const aiHeaderText = `✦ AI Compliance Check · ${sub.confidence}% confidence`;

  // show atomic + activation if approved or sub_c selected
  const showAtomic = sub.status === 'approved' || state.atomicVisible || sub.id === 'sub_c';

  const manualChecksHtml = manualIds.map(mId => {
    const key = sub.id + '_' + mId;
    const checked = !!state.manualChecks[key];
    return `<label class="manual-check-item">
      <input type="checkbox" ${checked ? 'checked' : ''} onchange="toggleManual('${key}')">
      <span>${manualLabels[mId]}</span>
    </label>`;
  }).join('');

  const changesTagsHtml = ['Copy','Image','Compliance','Brand'].map(tag => {
    const sel = state.selectedChangeTags.includes(tag);
    return `<span class="tag-pill ${sel ? 'selected' : ''}" onclick="toggleChangeTag('${tag}')">${tag}</span>`;
  }).join('');

  const overallBannerClass = sub.aiStatus === 'pass' ? 'ok' : 'warn';
  const overallBannerText = sub.aiStatus === 'pass' ? '✓ Ready for Approval' : '⚠ Issues Detected — Review Required';

  let atomicHtml = '';
  if (showAtomic) {
    atomicHtml = `
      <div class="section-block">
        <div class="section-block-header">Atomic Asset Diagram</div>
        <div class="atomic-diagram">
          <div class="atomic-row">
            <div class="atomic-box master">Master Creative</div>
          </div>
          <div class="atomic-arrow">↓</div>
          <div class="atomic-row" style="flex-wrap:wrap;gap:5px;">
            <div class="atomic-box component">Text Layer</div>
            <div class="atomic-box component">Image Layer</div>
            <div class="atomic-box component">Logo Layer</div>
            <div class="atomic-box component">Background</div>
          </div>
          <div class="atomic-arrow">↓</div>
          <div class="atomic-row" style="flex-wrap:wrap;gap:5px;">
            <div class="atomic-box channel">Email</div>
            <div class="atomic-box channel">DV360</div>
            <div class="atomic-box channel">On-site</div>
            <div class="atomic-box channel">Meta</div>
          </div>
          <div class="atomic-arrow">↓</div>
          <div class="atomic-row">
            <div class="atomic-box output">18 Ad Variants</div>
          </div>
        </div>
      </div>
    `;
  }

  let activationHtml = '';
  if (showAtomic) {
    const channelList = [
      {id:'email', label:'Email', count:1},
      {id:'dv360', label:'DV360', count:3},
      {id:'ttd', label:'The Trade Desk', count:3},
      {id:'onsite', label:'Home Depot On-site', count:11},
      {id:'meta', label:'Meta / Facebook', count:3},
      {id:'pinterest', label:'Pinterest', count:1},
    ];
    const activated = state.activatedChannels.length > 0;

    const channelChecks = channelList.map(ch => {
      const isActive = state.activatedChannels.includes(ch.id);
      return `<label class="channel-check-item">
        <input type="checkbox" ${(activated || true) ? 'checked' : ''} id="chk_${sub.id}_${ch.id}">
        <span>${ch.label} <span style="color:#9BAFBF;">(${ch.count} size${ch.count>1?'s':''})</span></span>
      </label>`;
    }).join('');

    const successBanner = activated
      ? `<div class="activation-success">✓ Creative Activated — Live in ~2 hours
          <div class="activated-channels">
            ${state.activatedChannels.map(c => `<span class="badge badge-green">${c}</span>`).join('')}
          </div>
        </div>` : '';

    activationHtml = `
      <div class="section-block">
        <div class="section-block-header">Activation Dashboard</div>
        <div class="activation-section">
          ${channelChecks}
          <div class="date-row">
            <div class="date-group">
              <div class="date-label">Start Date</div>
              <input class="date-input" type="date" id="dateStart_${sub.id}" value="${todayStr()}">
            </div>
            <div class="date-group">
              <div class="date-label">End Date</div>
              <input class="date-input" type="date" id="dateEnd_${sub.id}" value="${thirtyDaysStr()}">
            </div>
          </div>
          <button class="btn btn-orange" style="width:100%;" onclick="activateChannels('${sub.id}')">Activate to Channels →</button>
          ${successBanner}
        </div>
      </div>
    `;
  }

  panel.innerHTML = `
    <div class="ret-actions-inner">

      <!-- AI Compliance -->
      <div class="section-block">
        <div class="section-block-header">
          AI Compliance Report
          <span class="ai-badge-inline">✦ AI</span>
        </div>
        <div style="font-size:11px;font-weight:600;color:#6B7B8D;margin-bottom:8px;">${aiHeaderText}</div>
        ${complianceItems.map(item => `
          <div class="compliance-item">
            <span class="ci-icon ${item.icon}">${item.icon === 'ok' ? '✓' : '⚠'}</span>
            <span class="ci-text">${item.text}</span>
          </div>
        `).join('')}
        <div class="compliance-banner ${overallBannerClass}">${overallBannerText}</div>
      </div>

      <div class="divider"></div>

      <!-- Manual Checklist -->
      <div class="section-block">
        <div class="section-block-header">Manual Checklist</div>
        ${manualChecksHtml}
      </div>

      <div class="divider"></div>

      <!-- Action Buttons -->
      <div class="section-block">
        <div class="section-block-header">Actions</div>
        <div class="action-btns">
          ${sub.status !== 'approved' ? `
            <button class="btn btn-green" onclick="approveSubmission('${sub.id}')">✓ Approve</button>
          ` : '<div class="badge badge-green" style="padding:8px 12px;display:block;text-align:center;font-size:12px;">✓ Already Approved</div>'}

          <button class="btn btn-yellow" onclick="toggleChangesInput('${sub.id}')">↩ Request Changes</button>
          <div class="inline-input-group ${state.changesInputOpen ? 'visible' : ''}" id="changesGroup_${sub.id}">
            <div class="tag-pills">${changesTagsHtml}</div>
            <textarea class="inline-textarea" id="changesNote_${sub.id}" placeholder="Describe the changes needed..."></textarea>
            <button class="btn btn-yellow btn-sm" onclick="sendChangesRequest('${sub.id}')">Send Request →</button>
          </div>

          ${sub.status !== 'rejected' ? `
            <button class="btn btn-red" onclick="toggleRejectInput('${sub.id}')">✗ Reject</button>
            <div class="inline-input-group ${state.rejectInputOpen ? 'visible' : ''}" id="rejectGroup_${sub.id}">
              <textarea class="inline-textarea" id="rejectNote_${sub.id}" placeholder="Reason for rejection..."></textarea>
              <button class="btn btn-red btn-sm" onclick="confirmReject('${sub.id}')">Confirm Reject</button>
            </div>
          ` : '<div class="badge badge-red" style="padding:8px 12px;display:block;text-align:center;font-size:12px;">✗ Already Rejected</div>'}
        </div>
      </div>

      ${atomicHtml}
      ${activationHtml}

    </div>
  `;
}

// ════════════════════════════════════════
//  RETAILER ACTIONS
// ════════════════════════════════════════

function approveSubmission(id) {
  const sub = state.submissions.find(s => s.id === id);
  if (!sub) return;
  sub.status = 'approved';
  state.atomicVisible = true;
  // Move to approved tab
  if (!TAB_CONFIG.approved.ids.includes(id)) TAB_CONFIG.approved.ids.unshift(id);
  TAB_CONFIG.pending.ids = TAB_CONFIG.pending.ids.filter(i => i !== id);
  state.retTab = 'approved';
  state.selectedSubmissionId = id;
  renderRetailer();
}

function toggleManual(key) {
  state.manualChecks[key] = !state.manualChecks[key];
}

function toggleChangesInput(id) {
  state.changesInputOpen = !state.changesInputOpen;
  state.rejectInputOpen = false;
  const grp = document.getElementById('changesGroup_' + id);
  const rejGrp = document.getElementById('rejectGroup_' + id);
  if (grp) grp.classList.toggle('visible', state.changesInputOpen);
  if (rejGrp) rejGrp.classList.remove('visible');
}

function toggleRejectInput(id) {
  state.rejectInputOpen = !state.rejectInputOpen;
  state.changesInputOpen = false;
  const grp = document.getElementById('rejectGroup_' + id);
  const chGrp = document.getElementById('changesGroup_' + id);
  if (grp) grp.classList.toggle('visible', state.rejectInputOpen);
  if (chGrp) chGrp.classList.remove('visible');
}

function toggleChangeTag(tag) {
  const idx = state.selectedChangeTags.indexOf(tag);
  if (idx >= 0) state.selectedChangeTags.splice(idx, 1);
  else state.selectedChangeTags.push(tag);
  // Re-render just the tag pills
  const container = document.querySelector('.tag-pills');
  if (container) {
    container.innerHTML = ['Copy','Image','Compliance','Brand'].map(t => {
      const sel = state.selectedChangeTags.includes(t);
      return `<span class="tag-pill ${sel ? 'selected' : ''}" onclick="toggleChangeTag('${t}')">${t}</span>`;
    }).join('');
  }
}

function sendChangesRequest(id) {
  const noteEl = document.getElementById('changesNote_' + id);
  const note = noteEl ? noteEl.value : '';
  const sub = state.submissions.find(s => s.id === id);
  if (sub) { sub.status = 'revisions'; }
  if (!TAB_CONFIG.revisions.ids.includes(id)) TAB_CONFIG.revisions.ids.push(id);
  TAB_CONFIG.pending.ids = TAB_CONFIG.pending.ids.filter(i => i !== id);
  state.retTab = 'revisions';
  state.changesInputOpen = false;
  state.selectedChangeTags = [];
  renderRetailer();
}

function confirmReject(id) {
  const sub = state.submissions.find(s => s.id === id);
  if (sub) { sub.status = 'rejected'; }
  if (!TAB_CONFIG.rejected.ids.includes(id)) TAB_CONFIG.rejected.ids.push(id);
  TAB_CONFIG.pending.ids = TAB_CONFIG.pending.ids.filter(i => i !== id);
  state.retTab = 'rejected';
  state.rejectInputOpen = false;
  renderRetailer();
}

function activateChannels(id) {
  state.activatedChannels = ['email','dv360','ttd','onsite','meta','pinterest'];
  renderActionsPanel();
}

// ════════════════════════════════════════
//  INIT
// ════════════════════════════════════════

// Check auth on load
if (sessionStorage.getItem('cs_auth') === '1') {
  document.getElementById('loginScreen').classList.add('hidden');
}

// Initial render
renderSupplier();
</script>
