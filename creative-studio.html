<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vantage Creative Studio — HD Demo</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: Calibri, 'Segoe UI', sans-serif; background: #EDF1F5; color: #1E3A5F; font-size: 13px; display: flex; flex-direction: column; overflow: hidden; }

/* ──────────── LOGIN ──────────── */
#loginScreen { position: fixed; inset: 0; background: #1E3A5F; display: flex; align-items: center; justify-content: center; z-index: 999; }
#loginScreen.hidden { display: none; }
.login-card { background: #fff; border-radius: 14px; padding: 42px 46px; width: 390px; max-width: 94vw; box-shadow: 0 20px 70px rgba(0,0,0,0.45); }
.login-logo { font-size: 22px; font-weight: 700; color: #1E3A5F; margin-bottom: 4px; }
.login-logo span { color: #F97316; }
.login-sub { font-size: 12px; color: #6B7B8D; margin-bottom: 32px; }
.login-label { display: block; font-size: 11px; font-weight: 700; color: #6B7B8D; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 5px; }
.login-input { display: block; width: 100%; padding: 9px 12px; font-size: 13px; font-family: inherit; border: 1.5px solid #DDE3EA; border-radius: 7px; color: #1E3A5F; margin-bottom: 16px; outline: none; transition: border-color 0.15s; }
.login-input:focus { border-color: #1E3A5F; }
.login-input.error { border-color: #E53935; background: #FFEBEE; }
.login-btn { width: 100%; padding: 11px; font-size: 13px; font-weight: 700; font-family: inherit; background: #F97316; color: #fff; border: none; border-radius: 7px; cursor: pointer; transition: background 0.15s; margin-top: 4px; }
.login-btn:hover { background: #e06610; }
.login-error { min-height: 18px; font-size: 12px; color: #E53935; text-align: center; margin-top: 10px; }
.login-badge { margin-top: 22px; text-align: center; font-size: 11px; color: #aaa; }

/* ──────────── TOPBAR ──────────── */
.topbar { background: #1E3A5F; height: 52px; display: flex; align-items: center; padding: 0 20px; gap: 14px; flex-shrink: 0; color: #fff; }
.topbar-logo { font-size: 16px; font-weight: 700; letter-spacing: 0.4px; white-space: nowrap; margin-right: 4px; }
.topbar-logo span { color: #F97316; }
.topbar-center { flex: 1; display: flex; justify-content: center; }
.role-toggle { display: flex; background: rgba(255,255,255,0.13); border-radius: 7px; padding: 3px; gap: 2px; }
.rtoggle { padding: 4px 16px; font-size: 12px; font-weight: 600; font-family: inherit; border: none; border-radius: 5px; cursor: pointer; background: transparent; color: rgba(255,255,255,0.65); transition: all 0.15s; white-space: nowrap; }
.rtoggle.active { background: #fff; color: #1E3A5F; }
.topbar-right { display: flex; align-items: center; gap: 8px; }
.demo-btn { padding: 4px 11px; font-size: 11px; font-weight: 700; font-family: inherit; background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.85); border: 1px solid rgba(255,255,255,0.2); border-radius: 5px; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
.demo-btn:hover { background: rgba(255,255,255,0.22); color: #fff; }
.role-badge { background: rgba(249,115,22,0.9); color: #fff; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 4px; white-space: nowrap; }
.role-badge::before { content: '● '; font-size: 9px; }

/* ──────────── MAIN SHELL ──────────── */
.app-shell { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
.workspace { flex: 1; overflow: hidden; display: flex; flex-direction: column; }

/* ──────────── SUPPLIER VIEW ──────────── */
#supplierView { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
.sup-step-bar { background: #fff; border-bottom: 1px solid #DDE3EA; padding: 0 28px; height: 46px; display: flex; align-items: center; gap: 0; flex-shrink: 0; }
.step-item { display: flex; align-items: center; gap: 8px; padding: 0 12px; height: 100%; color: #aaa; font-size: 12px; font-weight: 600; white-space: nowrap; }
.step-item.active { color: #1E3A5F; border-bottom: 2px solid #F97316; }
.step-item.done { color: #43A047; }
.step-num { width: 22px; height: 22px; border-radius: 50%; background: #DDE3EA; color: #888; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.step-item.active .step-num { background: #1E3A5F; color: #fff; }
.step-item.done .step-num { background: #43A047; color: #fff; }
.step-arrow { color: #DDE3EA; font-size: 14px; flex-shrink: 0; }
.sup-content { flex: 1; overflow-y: auto; padding: 24px 28px; }

/* Template grid */
.tmpl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; max-width: 900px; }
.tmpl-card { background: #fff; border: 1.5px solid #DDE3EA; border-radius: 10px; padding: 18px 20px; transition: box-shadow 0.15s, border-color 0.15s; }
.tmpl-card:hover { box-shadow: 0 4px 20px rgba(30,58,95,0.10); border-color: #b0c0d0; }
.tmpl-card-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 6px; }
.tmpl-name { font-size: 14px; font-weight: 700; color: #1E3A5F; flex: 1; }
.badge-live { display: inline-block; background: #E8F5E9; color: #43A047; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 4px; text-transform: uppercase; }
.tmpl-channels { display: flex; flex-wrap: wrap; gap: 5px; margin: 8px 0; }
.ch-pill { background: #EDF1F5; color: #1E3A5F; font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 3px; }
.tmpl-constraints { font-size: 11px; color: #6B7B8D; margin-bottom: 6px; }
.tmpl-desc { font-size: 12px; color: #5a6a7a; margin-bottom: 12px; line-height: 1.45; }
.tmpl-supplier { font-size: 11px; color: #6B7B8D; margin-bottom: 14px; }
.tmpl-supplier strong { color: #1E3A5F; }
.btn-primary { padding: 8px 18px; font-size: 12px; font-weight: 700; font-family: inherit; background: #F97316; color: #fff; border: none; border-radius: 6px; cursor: pointer; transition: background 0.15s; white-space: nowrap; }
.btn-primary:hover { background: #e06610; }
.btn-secondary { padding: 8px 18px; font-size: 12px; font-weight: 700; font-family: inherit; background: #EDF1F5; color: #1E3A5F; border: 1.5px solid #DDE3EA; border-radius: 6px; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
.btn-secondary:hover { background: #dde3ea; }

/* Editor layout */
.editor-layout { display: grid; grid-template-columns: 340px 1fr; gap: 24px; max-width: 900px; }
.ad-preview-box { background: linear-gradient(145deg, #1E3A5F, #2e5087); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; position: relative; min-height: 240px; }
.ad-preview-inner { flex: 1; padding: 22px 20px 44px; display: flex; flex-direction: column; justify-content: space-between; position: relative; }
.ad-bg-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.45); border-radius: 10px 10px 0 0; }
.ad-content { position: relative; z-index: 1; }
.ad-headline-preview { font-size: 20px; font-weight: 700; color: #fff; line-height: 1.25; margin-bottom: 8px; word-break: break-word; }
.ad-sub-preview { font-size: 13px; color: rgba(255,255,255,0.82); line-height: 1.4; }
.ad-cta-preview { position: relative; z-index: 1; display: flex; justify-content: flex-end; margin-top: 16px; }
.ad-cta-btn { background: #F97316; color: #fff; font-size: 11px; font-weight: 700; padding: 7px 14px; border-radius: 5px; }
.ad-brand-bar { height: 10px; background: #F97316; flex-shrink: 0; }
.ad-preview-label { font-size: 11px; color: #6B7B8D; margin-top: 8px; text-align: center; }
.editor-form { display: flex; flex-direction: column; gap: 14px; }
.form-group { display: flex; flex-direction: column; gap: 5px; }
.form-label { font-size: 11px; font-weight: 700; color: #6B7B8D; text-transform: uppercase; letter-spacing: 0.4px; }
.form-input { padding: 8px 11px; font-size: 13px; font-family: inherit; border: 1.5px solid #DDE3EA; border-radius: 6px; color: #1E3A5F; outline: none; transition: border-color 0.15s; }
.form-input:focus { border-color: #1E3A5F; }
.form-textarea { padding: 8px 11px; font-size: 13px; font-family: inherit; border: 1.5px solid #DDE3EA; border-radius: 6px; color: #1E3A5F; outline: none; resize: vertical; min-height: 64px; transition: border-color 0.15s; }
.form-textarea:focus { border-color: #1E3A5F; }
.form-select { padding: 8px 11px; font-size: 13px; font-family: inherit; border: 1.5px solid #DDE3EA; border-radius: 6px; color: #1E3A5F; outline: none; background: #fff; cursor: pointer; }
.char-counter { font-size: 11px; text-align: right; color: #6B7B8D; }
.char-counter.warn { color: #E53935; font-weight: 700; }
.compliance-hint { font-size: 12px; font-weight: 600; padding: 7px 11px; border-radius: 6px; }
.compliance-hint.pass { background: #E8F5E9; color: #2E7D32; }
.compliance-hint.warn { background: #FFF3E0; color: #E65100; }
.upload-zone { border: 2px dashed #DDE3EA; border-radius: 8px; padding: 18px; text-align: center; cursor: pointer; transition: border-color 0.15s, background 0.15s; color: #6B7B8D; font-size: 12px; }
.upload-zone:hover { border-color: #F97316; background: #FFF7F2; }
.upload-zone.has-img { border-color: #43A047; background: #F1F8E9; }
.upload-thumb { max-width: 100%; max-height: 80px; border-radius: 4px; margin-top: 8px; }
.legal-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #5a6a7a; cursor: pointer; }
.legal-row input { width: 14px; height: 14px; accent-color: #1E3A5F; cursor: pointer; }
.editor-actions { display: flex; gap: 10px; margin-top: 8px; }

/* Preview grid */
.preview-header { margin-bottom: 16px; }
.preview-header h2 { font-size: 16px; font-weight: 700; color: #1E3A5F; margin-bottom: 4px; }
.preview-header p { font-size: 12px; color: #6B7B8D; }
.preview-status-banner { padding: 10px 16px; border-radius: 7px; font-size: 13px; font-weight: 600; margin-bottom: 18px; }
.preview-status-banner.ok { background: #E8F5E9; color: #2E7D32; }
.preview-status-banner.warn { background: #FFF3E0; color: #E65100; }
.channel-group { margin-bottom: 22px; }
.channel-group-header { font-size: 11px; font-weight: 700; color: #6B7B8D; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; padding-bottom: 5px; border-bottom: 1px solid #EDF1F5; }
.thumb-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
.thumb-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.ad-thumb { border-radius: 3px; overflow: hidden; position: relative; background: linear-gradient(145deg, #1E3A5F, #2e5087); flex-shrink: 0; }
.ad-thumb-headline { position: absolute; top: 4px; left: 4px; right: 18px; font-size: 5px; font-weight: 700; color: #fff; line-height: 1.2; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.ad-thumb-bar { position: absolute; bottom: 0; left: 0; right: 0; height: 4px; background: #F97316; }
.ad-thumb-badge { position: absolute; top: 2px; right: 2px; width: 10px; height: 10px; border-radius: 50%; font-size: 7px; display: flex; align-items: center; justify-content: center; font-weight: 700; }
.ad-thumb-badge.pass { background: #43A047; color: #fff; }
.ad-thumb-badge.warn { background: #F97316; color: #fff; }
.thumb-label { font-size: 10px; color: #6B7B8D; text-align: center; line-height: 1.3; max-width: 110px; }
.preview-actions { display: flex; gap: 10px; margin-top: 8px; }
.sec-title { font-size: 18px; font-weight: 700; color: #1E3A5F; margin-bottom: 20px; }

/* Submitted */
.submitted-card { background: #fff; border: 1.5px solid #DDE3EA; border-radius: 12px; padding: 40px; max-width: 520px; margin: 0 auto; text-align: center; }
.submitted-check { width: 64px; height: 64px; border-radius: 50%; background: #E8F5E9; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; font-size: 28px; color: #43A047; }
.submitted-title { font-size: 22px; font-weight: 700; color: #1E3A5F; margin-bottom: 20px; }
.submitted-details { text-align: left; background: #EDF1F5; border-radius: 8px; padding: 16px 20px; margin-bottom: 20px; }
.submitted-row { display: flex; gap: 12px; font-size: 13px; padding: 4px 0; }
.submitted-row-label { color: #6B7B8D; font-weight: 600; min-width: 90px; }
.submitted-row-val { color: #1E3A5F; font-weight: 600; }
.submitted-note { font-size: 12px; color: #6B7B8D; line-height: 1.5; margin-bottom: 20px; }

/* ──────────── RETAILER VIEW ──────────── */
#retailerView { display: flex; flex: 1; overflow: hidden; }

/* Queue */
.ret-queue { width: 280px; flex-shrink: 0; border-right: 1px solid #DDE3EA; background: #fff; display: flex; flex-direction: column; overflow: hidden; }
.queue-tabs { display: flex; border-bottom: 1px solid #DDE3EA; flex-shrink: 0; }
.qtab { flex: 1; padding: 10px 4px; font-size: 11px; font-weight: 700; font-family: inherit; background: transparent; border: none; border-bottom: 2px solid transparent; cursor: pointer; color: #6B7B8D; transition: all 0.15s; white-space: nowrap; }
.qtab.active { color: #1E3A5F; border-bottom-color: #F97316; }
.queue-list { flex: 1; overflow-y: auto; }
.sub-card { padding: 12px 14px; border-bottom: 1px solid #EDF1F5; cursor: pointer; border-left: 3px solid transparent; transition: all 0.12s; }
.sub-card:hover { background: #F8FAFC; }
.sub-card.selected { background: #EDF4FF; border-left-color: #1E3A5F; }
.sub-card-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 3px; }
.sub-card-supplier { font-size: 12px; font-weight: 700; color: #1E3A5F; }
.ai-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.ai-dot.pass { background: #43A047; }
.ai-dot.warn { background: #F97316; }
.sub-card-tmpl { font-size: 11px; color: #6B7B8D; margin-bottom: 3px; }
.sub-card-headline { font-size: 12px; color: #333; font-style: italic; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sub-card-meta { display: flex; align-items: center; justify-content: space-between; }
.sub-card-date { font-size: 10px; color: #aaa; }
.status-chip { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 4px; text-transform: uppercase; }
.chip-pending { background: #FFF3E0; color: #E65100; }
.chip-approved { background: #E8F5E9; color: #2E7D32; }
.chip-rejected { background: #FFEBEE; color: #C62828; }
.chip-revisions { background: #FFFDE7; color: #F57F17; }
.queue-more { padding: 10px 14px; font-size: 11px; color: #aaa; border-top: 1px solid #EDF1F5; }

/* Review panel */
.ret-review { flex: 1; overflow-y: auto; padding: 20px; background: #EDF1F5; display: flex; flex-direction: column; gap: 16px; }
.review-empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #aaa; gap: 10px; }
.review-empty-arrow { font-size: 28px; }
.review-empty-text { font-size: 14px; }
.review-header-card { background: #fff; border-radius: 10px; padding: 18px 20px; border: 1.5px solid #DDE3EA; }
.review-supplier-name { font-size: 18px; font-weight: 700; color: #1E3A5F; margin-bottom: 4px; }
.review-meta { font-size: 12px; color: #6B7B8D; margin-bottom: 12px; }
.review-headline-block { background: linear-gradient(135deg, #1E3A5F, #2e5087); border-radius: 8px; padding: 16px 18px; color: #fff; margin-bottom: 8px; }
.review-headline-text { font-size: 16px; font-weight: 700; line-height: 1.25; margin-bottom: 5px; }
.review-sub-text { font-size: 12px; opacity: 0.82; }
.review-sizes-card { background: #fff; border-radius: 10px; padding: 18px 20px; border: 1.5px solid #DDE3EA; }
.review-sizes-title { font-size: 13px; font-weight: 700; color: #1E3A5F; margin-bottom: 12px; }
.sm-channel-label { font-size: 10px; font-weight: 700; color: #6B7B8D; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 6px; margin-top: 10px; }
.sm-thumb-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
.sm-thumb { border-radius: 2px; overflow: hidden; position: relative; background: linear-gradient(145deg, #1E3A5F, #2e5087); flex-shrink: 0; }
.sm-thumb-bar { position: absolute; bottom: 0; left: 0; right: 0; height: 3px; background: #F97316; }
.sm-thumb-badge { position: absolute; top: 1px; right: 1px; width: 8px; height: 8px; border-radius: 50%; font-size: 6px; display: flex; align-items: center; justify-content: center; }
.sm-thumb-badge.pass { background: #43A047; color: #fff; }
.sm-thumb-badge.warn { background: #F97316; color: #fff; }

/* Actions panel */
.ret-actions { width: 280px; flex-shrink: 0; border-left: 1px solid #DDE3EA; background: #fff; overflow-y: auto; display: flex; flex-direction: column; }
.act-section { padding: 14px 16px; border-bottom: 1px solid #EDF1F5; }
.act-section-title { font-size: 11px; font-weight: 700; color: #6B7B8D; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }

/* AI compliance */
.ai-header { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.ai-badge { font-size: 11px; font-weight: 700; color: #7B1FA2; }
.ai-confidence { font-size: 11px; color: #6B7B8D; margin-bottom: 10px; }
.ai-check-row { display: flex; align-items: flex-start; gap: 7px; font-size: 12px; color: #333; padding: 4px 0; line-height: 1.35; }
.ai-check-row.ok { color: #2E7D32; }
.ai-check-row.issue { color: #E65100; }
.ai-status-banner { padding: 8px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; margin-top: 10px; }
.ai-status-banner.ok { background: #E8F5E9; color: #2E7D32; }
.ai-status-banner.warn { background: #FFF3E0; color: #E65100; }

/* Manual checklist */
.check-item { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #333; padding: 5px 0; cursor: pointer; }
.check-item input[type=checkbox] { width: 14px; height: 14px; accent-color: #1E3A5F; cursor: pointer; flex-shrink: 0; }

/* Action buttons */
.act-btn { display: flex; align-items: center; gap: 7px; width: 100%; padding: 9px 14px; font-size: 12px; font-weight: 700; font-family: inherit; border-radius: 7px; cursor: pointer; border: none; margin-bottom: 8px; transition: all 0.15s; }
.act-btn.approve { background: #43A047; color: #fff; }
.act-btn.approve:hover { background: #388E3C; }
.act-btn.changes { background: #FFF3E0; color: #E65100; border: 1.5px solid #FFB74D; }
.act-btn.changes:hover { background: #FFE0B2; }
.act-btn.reject { background: #FFEBEE; color: #C62828; border: 1.5px solid #EF9A9A; }
.act-btn.reject:hover { background: #FFCDD2; }
.act-btn.disabled { opacity: 0.45; cursor: not-allowed; }
.expand-panel { background: #F8FAFC; border: 1.5px solid #DDE3EA; border-radius: 8px; padding: 12px; margin-bottom: 8px; display: flex; flex-direction: column; gap: 8px; }
.exp-textarea { width: 100%; padding: 8px 10px; font-size: 12px; font-family: inherit; border: 1.5px solid #DDE3EA; border-radius: 6px; resize: vertical; min-height: 70px; outline: none; }
.exp-textarea:focus { border-color: #1E3A5F; }
.tags-row { display: flex; flex-wrap: wrap; gap: 6px; }
.tag-pill { padding: 3px 10px; font-size: 11px; font-weight: 600; border-radius: 4px; border: 1.5px solid #DDE3EA; background: #fff; color: #6B7B8D; cursor: pointer; transition: all 0.12s; }
.tag-pill.active { background: #1E3A5F; color: #fff; border-color: #1E3A5F; }
.exp-btn { padding: 7px 14px; font-size: 12px; font-weight: 700; font-family: inherit; border-radius: 6px; border: none; cursor: pointer; }
.exp-btn.send { background: #F97316; color: #fff; }
.exp-btn.send:hover { background: #e06610; }
.exp-btn.confirm-reject { background: #E53935; color: #fff; }
.exp-btn.confirm-reject:hover { background: #c62828; }

/* Atomic diagram */
.atomic-diagram { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 0; }
.atomic-row { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.atomic-box { padding: 4px 10px; font-size: 10px; font-weight: 700; border-radius: 5px; white-space: nowrap; }
.atomic-box.master { background: #1E3A5F; color: #fff; }
.atomic-box.component { background: #E8F5E9; color: #2E7D32; border: 1px solid #A5D6A7; }
.atomic-box.channel { background: #FFF3E0; color: #E65100; border: 1px solid #FFCC80; }
.atomic-box.variants { background: #fff; color: #1E3A5F; border: 2px solid #1E3A5F; font-size: 11px; padding: 5px 14px; }
.atomic-arrow { color: #aaa; font-size: 14px; }

/* Activation */
.act-channel-row { display: flex; align-items: center; gap: 8px; font-size: 12px; padding: 5px 0; cursor: pointer; }
.act-channel-row input[type=checkbox] { accent-color: #F97316; width: 13px; height: 13px; cursor: pointer; flex-shrink: 0; }
.act-channel-name { flex: 1; color: #1E3A5F; font-weight: 600; }
.act-channel-count { font-size: 11px; color: #6B7B8D; }
.date-row { display: flex; gap: 10px; margin: 10px 0; }
.date-col { display: flex; flex-direction: column; gap: 4px; flex: 1; }
.date-label { font-size: 10px; font-weight: 700; color: #6B7B8D; text-transform: uppercase; letter-spacing: 0.4px; }

function fmtDate(iso) {
  return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function todayStr() {
  return new Date().toISOString().split('T')[0];
}

function plus30() {
  const d = new Date();
  d.setDate(d.getDate() + 30);
  return d.toISOString().split('T')[0];
}

function fmtDateTime(iso) {
  return new Date(iso).toLocaleString('en-US', {
    month: 'long', day: 'numeric', year: 'numeric',
    hour: 'numeric', minute: '2-digit', hour12: true
  });
}

function scaledDims(spec, maxW) {
  maxW = maxW || 110;
  const ratio = spec.w / spec.h;
  if (ratio >= 1) {
    const w = Math.min(spec.w, maxW);
    const h = Math.max(Math.round(w / ratio), 14);
    return { w, h };
  } else {
    const h = Math.min(spec.h, maxW);
    const w = Math.max(Math.round(h * ratio), 14);
    return { w, h };
  }
}

function checkCompliance(headline, sub) {
  const SUPERS = ['best', 'most', 'only', 'always', 'lowest', 'highest', 'never', 'perfect', 'greatest', '#1', 'number one'];
  const text = ((headline || '') + ' ' + (sub || '')).toLowerCase();
  const found = SUPERS.filter(s => text.includes(s));
  return {
    pass: found.length === 0,
    issues: found.map(s => 'Superlative "' + s + '" requires substantiation')
  };
}

  };
  return '<span class="status-chip ' + (map[status] || '') + '">' + (labels[status] || status) + '</span>';
}

function esc(str) {

  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

  const sub = state.submissions.find(s => s.id === id);

  sub.status = 'approved';
  TAB_CONFIG.pending.ids = TAB_CONFIG.pending.ids.filter(i => i !== id);
  TAB_CONFIG.revisions.ids = TAB_CONFIG.revisions.ids.filter(i => i !== id);
  if (!TAB_CONFIG.approved.ids.includes(id)) TAB_CONFIG.approved.ids.unshift(id);
  state.atomicVisible = true;
  state.retTab = 'approved';
  state.selectedSubId = id;
  state.changesOpen = false;
  state.rejectOpen = false;
  renderAll();
  showToast('Submission approved', 'success');
}

function requestChanges(id) {
  const sub = state.submissions.find(s => s.id === id);
  if (!sub) return;
  sub.status = 'revisions';
  TAB_CONFIG.pending.ids = TAB_CONFIG.pending.ids.filter(i => i !== id);
  if (!TAB_CONFIG.revisions.ids.includes(id)) TAB_CONFIG.revisions.ids.push(id);
  state.changesOpen = false;
  state.changeTags = [];
  state.changesText = '';
  state.retTab = 'revisions';
  state.atomicVisible = false;
  renderAll();
  showToast('Changes requested');
}

function confirmReject(id) {

  TAB_CONFIG.pending.ids = TAB_CONFIG.pending.ids.filter(i => i !== id);

function renderStepBar() {
  const steps = [

    { key: 'editor',    label: 'Editor',    n: 2 },
    { key: 'preview',   label: 'Preview',   n: 3 },

  const order = ['templates', 'editor', 'preview', 'submitted'];
  const cur = order.indexOf(state.supStep);
  let html = '';
  steps.forEach(function(s, i) {
    const idx = order.indexOf(s.key);
    let cls = '';
    if (idx < cur) cls = 'done';
    else if (idx === cur) cls = 'active';
    if (i > 0) html += '<span class="step-arrow">&rsaquo;</span>';
    html += '<div class="step-item ' + cls + '">';
    html += '<div class="step-num">' + (idx < cur ? '&#10003;' : s.n) + '</div>';
    html += '<span>' + s.label + '</span></div>';
  });
  document.getElementById('supStepBar').innerHTML = html;
}

  html += '<div class="char-counter' + (hWarn ? ' warn' : '') + '">' + hLen + '/' + hMax + ' chars</div>';
  // Compliance hint
  if (state.headline.length > 0 || state.subheading.length > 0) {
    if (compliance.pass) {
      html += '<div class="compliance-hint pass">&#10003; Copy looks compliant</div>';
    } else {
      html += '<div class="compliance-hint warn">&#9888; AI Flag: ' + esc(compliance.issues[0]) + (compliance.issues.length > 1 ? ' (+' + (compliance.issues.length - 1) + ' more)' : '') + '</div>';
    }
  }
  html += '</div>';

  // Subheading
  html += '<div class="form-group">';
  html += '<label class="form-label" for="subInput">Subheading</label>';
  html += '<textarea class="form-textarea" id="subInput" maxlength="' + sMax + '" placeholder="Enter subheading..." oninput="onSubInput(this.value)">' + esc(state.subheading) + '</textarea>';
  html += '<div class="char-counter' + (sWarn ? ' warn' : '') + '">' + sLen + '/' + sMax + ' chars</div>';
  html += '</div>';

  // CTA
  html += '<div class="form-group">';
  html += '<label class="form-label" for="ctaSelect">Call to Action</label>';
  html += '<select class="form-select" id="ctaSelect" onchange="onCtaChange(this.value)">';
  tmpl.constraints.cta.forEach(function(c) {
    html += '<option value="' + esc(c) + '"' + (state.cta === c ? ' selected' : '') + '>' + esc(c) + '</option>';
  });
  html += '</select>';
  html += '</div>';

  // Legal
  html += '<div class="form-group">';
  html += '<label class="legal-row"><input type="checkbox" ' + (state.includeLegal ? 'checked' : '') + ' onchange="state.includeLegal=this.checked"> Include HD legal disclaimer</label>';
  html += '</div>';

  // Buttons
  html += '<div class="editor-actions">';
  html += '<button class="btn-secondary" onclick="goToTemplates()">&larr; Back to Templates</button>';
  html += '<button class="btn-primary" onclick="goToPreview()">Generate 18 Sizes &rarr;</button>';
  html += '</div>';

  html += '</div>';
  html += '</div>';

  return html;
}

function bindEditorEvents() {
  // drag and drop on upload zone
  const zone = document.getElementById('uploadZone');
  if (!zone) return;
  zone.addEventListener('dragover', function(e) {
    e.preventDefault();
    zone.style.borderColor = '#F97316';
  });
  zone.addEventListener('dragleave', function() {
    zone.style.borderColor = '';
  });
  zone.addEventListener('drop', function(e) {
    e.preventDefault();
    zone.style.borderColor = '';
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) readImageFile(file);
  });
}

function handleImageUpload(e) {
  const file = e.target.files[0];
  if (file) readImageFile(file);
}

function readImageFile(file) {
  const reader = new FileReader();
  reader.onload = function(ev) {
    state.uploadedImage = ev.target.result;
    renderSupplierView();
  };
  reader.readAsDataURL(file);
}

function onHeadlineInput(val) {
  state.headline = val;
  // Update live preview headline
  const prev = document.querySelector('.ad-headline-preview');
  if (prev) prev.textContent = val || 'Your headline here';
  // Update char counter
  const tmpl = state.selectedTemplate;
  const hMax = tmpl.constraints.headlineMax;
  const counter = document.querySelector('.form-group:nth-child(3) .char-counter');
  if (counter) {
    counter.textContent = val.length + '/' + hMax + ' chars';
    counter.classList.toggle('warn', val.length >= Math.floor(hMax * 0.9));
  }
  // Update compliance hint
  updateComplianceHint();
}

function onSubInput(val) {
  state.subheading = val;
  const prev = document.querySelector('.ad-sub-preview');
  if (prev) prev.textContent = val || 'Subheading text';
  updateComplianceHint();
}

function onCtaChange(val) {
  state.cta = val;
  const ctaBtn = document.querySelector('.ad-cta-btn');
  if (ctaBtn) ctaBtn.textContent = val;
}

function updateComplianceHint() {
  const compliance = checkCompliance(state.headline, state.subheading);
  // Find the compliance hint element — it's after the headline char counter
  let hint = document.querySelector('.compliance-hint');
  const hGroup = document.getElementById('headlineInput');
  if (!hGroup) return;
  const formGroup = hGroup.closest('.form-group');
  if (!formGroup) return;

  if (state.headline.length === 0 && state.subheading.length === 0) {
    if (hint) hint.remove();
    return;
  }

  if (!hint) {
    hint = document.createElement('div');
    hint.className = 'compliance-hint';
    formGroup.appendChild(hint);
  }

  if (compliance.pass) {
    hint.className = 'compliance-hint pass';
    hint.textContent = '\u2713 Copy looks compliant';
  } else {
    hint.className = 'compliance-hint warn';
    hint.textContent = '\u26A0 AI Flag: ' + compliance.issues[0] + (compliance.issues.length > 1 ? ' (+' + (compliance.issues.length - 1) + ' more)' : '');
  }
}

function goToTemplates() {
  state.supStep = 'templates';
  renderSupplierView();
}

function goToPreview() {
  if (!state.headline.trim()) {
    showToast('Please enter a headline first', 'error');
    return;
  }
  state.supStep = 'preview';
  renderSupplierView();
}

function renderPreviewGrid() {
  const compliance = checkCompliance(state.headline, state.subheading);
  const flaggedCount = compliance.pass ? 0 : 2;
  const totalSizes = AD_SPECS.length;
  const okSizes = totalSizes - flaggedCount;

  let html = '<div class="preview-header">';
  html += '<h2>18 Ad Sizes &mdash; Auto-Generated from 1 Master Creative</h2>';
  html += '<p>Atomic asset engine assembled all sizes from your uploaded image + copy</p>';
  html += '</div>';

  if (compliance.pass) {
    html += '<div class="preview-status-banner ok">&#10003; All 18 sizes ready &mdash; no compliance issues</div>';
  } else {
    html += '<div class="preview-status-banner warn">&#9888; ' + okSizes + ' ready &middot; ' + flaggedCount + ' flagged &mdash; review copy before submitting</div>';
  }

  const channels = ['Email', 'DV360', 'On-site', 'Meta'];
  const channelIcons = { Email: '&#128139;', DV360: '&#128250;', 'On-site': '&#127968;', Meta: '&#128241;' };

  channels.forEach(function(ch) {
    const specs = AD_SPECS.filter(s => s.channel === ch);
    if (!specs.length) return;
    html += '<div class="channel-group">';
    html += '<div class="channel-group-header">' + (channelIcons[ch] || '') + ' ' + ch + ' (' + specs.length + ' size' + (specs.length > 1 ? 's' : '') + ')</div>';
    html += '<div class="thumb-row">';
    specs.forEach(function(spec, i) {
      const dims = scaledDims(spec, 110);
      const isFlagged = !compliance.pass && i < flaggedCount;
      const badgeCls = isFlagged ? 'warn' : 'pass';
      const badgeChar = isFlagged ? '&#9888;' : '&#10003;';
      html += '<div class="thumb-wrap">';
      html += '<div class="ad-thumb" style="width:' + dims.w + 'px;height:' + dims.h + 'px;">';
      html += '<span class="ad-thumb-headline">' + esc(state.headline) + '</span>';
      html += '<div class="ad-thumb-bar"></div>';
      html += '<div class="ad-thumb-badge ' + badgeCls + '">' + badgeChar + '</div>';
      html += '</div>';
      html += '<div class="thumb-label">' + esc(spec.label) + '<br><span style="color:#aaa">' + spec.w + '&times;' + spec.h + '</span></div>';
      html += '</div>';
    });
    html += '</div></div>';
  });

  html += '<div class="preview-actions">';
  html += '<button class="btn-secondary" onclick="backToEditor()">&larr; Back to Editor</button>';
  html += '<button class="btn-primary" onclick="submitCreative()">Submit for Approval &rarr;</button>';
  html += '</div>';

  return html;
}

function backToEditor() {
  state.supStep = 'editor';
  renderSupplierView();
}

function submitCreative() {
  state.supStep = 'submitted';
  renderSupplierView();
}

function renderSubmitted() {
  const tmpl = state.selectedTemplate;
  const now = new Date();
  const dateStr = now.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }) + ' at ' +
    now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });

  let html = '<div class="submitted-card">';
  html += '<div class="submitted-check">&#10003;</div>';
  html += '<div class="submitted-title">Creative Submitted!</div>';
  html += '<div class="submitted-details">';
  html += '<div class="submitted-row"><span class="submitted-row-label">Template:</span><span class="submitted-row-val">' + esc(tmpl ? tmpl.name : 'Spring Paint Sale') + '</span></div>';
  html += '<div class="submitted-row"><span class="submitted-row-label">Headline:</span><span class="submitted-row-val">' + esc(state.headline || '30% Off Interior Paints') + '</span></div>';
  html += '<div class="submitted-row"><span class="submitted-row-label">Channels:</span><span class="submitted-row-val">' + esc(tmpl ? tmpl.channels.join(', ') : 'Email, DV360, On-site, Meta') + '</span></div>';
  html += '<div class="submitted-row"><span class="submitted-row-label">Sizes:</span><span class="submitted-row-val">18 ad sizes generated</span></div>';
  html += '<div class="submitted-row"><span class="submitted-row-label">Submitted:</span><span class="submitted-row-val">' + dateStr + '</span></div>';
  html += '</div>';
  html += '<div class="submitted-note">Home Depot will review within 24 hours.<br>You&rsquo;ll receive an email notification when approved.</div>';
  html += '<button class="btn-primary" onclick="resetSupplier()">Create Another Ad &rarr;</button>';
  html += '</div>';

  return html;
}

function resetSupplier() {
  state.supStep = 'templates';
  state.selectedTemplate = null;
  state.headline = '';
  state.subheading = '';
  state.cta = 'Shop Now';
  state.uploadedImage = null;
  renderSupplierView();
}

// ─────────────────────────────────────────────
//  RETAILER VIEW
// ─────────────────────────────────────────────

function renderRetailerView() {
  renderQueueTabs();
  renderQueueList();
  renderReviewPanel();
  renderActionsPanel();
}

function renderQueueTabs() {
  const tabs = ['pending', 'approved', 'rejected', 'revisions'];
  let html = '';
  tabs.forEach(function(t) {
    const cfg = TAB_CONFIG[t];
    html += '<button class="qtab' + (state.retTab === t ? ' active' : '') + '" onclick="switchTab(\'' + t + '\')">';
    html += esc(cfg.label) + ' (' + cfg.total + ')';
    html += '</button>';
  });
  document.getElementById('queueTabs').innerHTML = html;
}

function switchTab(tab) {
  state.retTab = tab;
  state.selectedSubId = null;
  renderRetailerView();
}

function renderQueueList() {
  const cfg = TAB_CONFIG[state.retTab];
  const ids = cfg.ids;
  const shown = ids;
  const extra = cfg.total - shown.length;

  let html = '';
  shown.forEach(function(id) {
    const sub = state.submissions.find(s => s.id === id);
    if (!sub) return;
    const sel = state.selectedSubId === id;
    html += '<div class="sub-card' + (sel ? ' selected' : '') + '" onclick="selectSubmission(\'' + id + '\')">';
    html += '<div class="sub-card-top">';
    html += '<span class="sub-card-supplier">' + esc(sub.supplier) + '</span>';
    html += '<div class="ai-dot ' + sub.aiStatus + '"></div>';
    html += '</div>';
    html += '<div class="sub-card-tmpl">' + esc(sub.template) + '</div>';
    html += '<div class="sub-card-headline">&ldquo;' + esc(sub.headline) + '&rdquo;</div>';
    html += '<div class="sub-card-meta">';
    html += '<span class="sub-card-date">' + fmtDate(sub.submittedAt) + '</span>';
    html += statusChipHTML(sub.status);
    html += '</div>';
    html += '</div>';
  });

  document.getElementById('queueList').innerHTML = html;
  document.getElementById('queueMore').innerHTML = extra > 0 ? '...and ' + extra + ' more' : '';
}

function selectSubmission(id) {
  state.selectedSubId = id;
  const sub = state.submissions.find(s => s.id === id);
  state.atomicVisible = sub && (sub.status === 'approved' || sub.scenario === 'c');
  state.activatedChannels = [];
  state.changesOpen = false;
  state.rejectOpen = false;
  renderRetailerView();
}

function renderReviewPanel() {
  const panel = document.getElementById('reviewPanel');

  if (!state.selectedSubId) {
    panel.innerHTML = '<div class="review-empty"><div class="review-empty-arrow">&#8592;</div><div class="review-empty-text">Select a submission from the queue to review</div></div>';
    return;
  }

  const sub = state.submissions.find(s => s.id === state.selectedSubId);
  if (!sub) {
    panel.innerHTML = '<div class="review-empty"><div class="review-empty-text">Submission not found</div></div>';
    return;
  }

  let html = '';

  // Header card
  html += '<div class="review-header-card">';
  html += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">';
  html += '<div class="review-supplier-name">' + esc(sub.supplier) + '</div>';
  html += statusChipHTML(sub.status);
  html += '</div>';
  html += '<div class="review-meta">Template: ' + esc(sub.template) + ' &nbsp;&middot;&nbsp; Submitted: ' + fmtDate(sub.submittedAt) + ' &nbsp;&middot;&nbsp; CTA: ' + esc(sub.cta) + '</div>';
  html += '<div class="review-headline-block">';
  html += '<div class="review-headline-text">&ldquo;' + esc(sub.headline) + '&rdquo;</div>';
  html += '<div class="review-sub-text">' + esc(sub.subheading) + '</div>';
  html += '</div>';
  html += '</div>';

  // All 18 sizes
  html += '<div class="review-sizes-card">';
  html += '<div class="review-sizes-title">All 18 Ad Sizes</div>';

  const channels = ['Email', 'DV360', 'On-site', 'Meta'];
  channels.forEach(function(ch) {
    const specs = AD_SPECS.filter(s => s.channel === ch);
    if (!specs.length) return;
    html += '<div class="sm-channel-label">' + ch + '</div>';
    html += '<div class="sm-thumb-row">';
    specs.forEach(function(spec, i) {
      const dims = scaledDims(spec, 54);
      const isFlagged = sub.aiStatus === 'warn' && i < sub.aiIssues.length;
      html += '<div class="sm-thumb" style="width:' + dims.w + 'px;height:' + dims.h + 'px;">';
      html += '<div class="sm-thumb-bar"></div>';
      html += '<div class="sm-thumb-badge ' + (isFlagged ? 'warn' : 'pass') + '">' + (isFlagged ? '!' : '&#10003;') + '</div>';
      html += '</div>';
    });
    html += '</div>';
  });

  html += '</div>';

  panel.innerHTML = html;
}

function renderActionsPanel() {
  const panel = document.getElementById('actionsPanel');

  if (!state.selectedSubId) {
    panel.innerHTML = '<div class="actions-empty">Select a submission to see actions</div>';
    return;
  }

  const sub = state.submissions.find(s => s.id === state.selectedSubId);
  if (!sub) {
    panel.innerHTML = '<div class="actions-empty">No submission selected</div>';
    return;
  }

  let html = '';

  // AI Compliance
  html += '<div class="act-section">';
  html += '<div class="ai-header"><span style="color:#7B1FA2;font-size:14px;">&#10022;</span><span class="ai-badge">AI Compliance Check</span></div>';
  html += '<div class="ai-confidence">Claude API &middot; ' + sub.confidence + '% confidence</div>';

  const aiChecks = [
    { label: 'Logo placement: compliant', ok: true },
    { label: 'Text overlay: readable', ok: true },
    { label: 'Brand colors: HD palette', ok: true },
    { label: 'Copy tone: matches HD', ok: sub.aiStatus === 'pass' },
    { label: 'Legal disclaimer: present', ok: true }
  ];

  aiChecks.forEach(function(c) {
    html += '<div class="ai-check-row ' + (c.ok ? 'ok' : 'issue') + '">';
    html += (c.ok ? '&#10003;' : '&#9888;') + ' ' + esc(c.label);
    html += '</div>';
  });

  if (sub.aiStatus === 'warn') {
    sub.aiIssues.forEach(function(issue) {
      html += '<div class="ai-check-row issue">&#9888; ' + esc(issue) + '</div>';
    });
    html += '<div class="ai-status-banner warn">&#9888; Issues Detected</div>';
  } else {
    html += '<div class="ai-status-banner ok">&#10003; Ready for Approval</div>';
  }

  html += '</div>';

  // Manual checklist
  html += '<div class="act-section">';
  html += '<div class="act-section-title">Manual Checklist</div>';
  const checks = [
    { id: 'c1', label: 'Logo quality acceptable' },
    { id: 'c2', label: 'Imagery matches campaign theme' },
    { id: 'c3', label: 'CTA clear and compelling' },
    { id: 'c4', label: 'No competing brand mentions' },
    { id: 'c5', label: 'Pricing / offer is accurate' }
  ];
  const ck = state.manualChecks[sub.id] || {};
  checks.forEach(function(c) {
    html += '<label class="check-item"><input type="checkbox" ' + (ck[c.id] ? 'checked' : '') + ' onchange="toggleManualCheck(\'' + sub.id + '\',\'' + c.id + '\',this.checked)"> ' + esc(c.label) + '</label>';
  });
  html += '</div>';

  // Action buttons
  html += '<div class="act-section">';
  html += '<div class="act-section-title">Actions</div>';

  if (sub.status === 'approved') {
    html += '<div class="ai-status-banner ok" style="margin-bottom:8px;">&#10003; Already Approved</div>';
  } else if (sub.status === 'rejected') {
    html += '<div class="ai-status-banner warn" style="margin-bottom:8px;">&#10007; Already Rejected</div>';
  } else {
    // Approve
    html += '<button class="act-btn approve" onclick="approveSubmission(\'' + sub.id + '\')">&#10003; Approve</button>';

    // Request Changes
    html += '<button class="act-btn changes" onclick="toggleChangesPanel(\'' + sub.id + '\')">&#8617; Request Changes</button>';
    if (state.changesOpen) {
      html += '<div class="expand-panel">';
      html += '<textarea class="exp-textarea" id="changesTextarea" placeholder="What needs to change?" oninput="state.changesText=this.value">' + esc(state.changesText) + '</textarea>';
      html += '<div class="tags-row">';
      ['Copy', 'Image', 'Compliance', 'Brand', 'Other'].forEach(function(tag) {
        const active = state.changeTags.includes(tag);
        html += '<span class="tag-pill' + (active ? ' active' : '') + '" onclick="toggleTag(\'' + tag + '\')">' + tag + '</span>';
      });
      html += '</div>';
      html += '<button class="exp-btn send" onclick="requestChanges(\'' + sub.id + '\')">Send Feedback</button>';
      html += '</div>';
    }

    // Reject
    html += '<button class="act-btn reject" onclick="toggleRejectPanel(\'' + sub.id + '\')">&#10007; Reject</button>';
    if (state.rejectOpen) {
      html += '<div class="expand-panel">';
      html += '<textarea class="exp-textarea" id="rejectTextarea" placeholder="Reason for rejection..." oninput="state.rejectText=this.value">' + esc(state.rejectText) + '</textarea>';
      html += '<button class="exp-btn confirm-reject" onclick="confirmReject(\'' + sub.id + '\')">Confirm Reject</button>';
      html += '</div>';
    }
  }

  html += '</div>';

  // Atomic diagram
  if (state.atomicVisible) {
    html += '<div class="act-section">';
    html += '<div class="act-section-title">Atomic Asset Engine</div>';
    html += '<div class="atomic-diagram">';
    html += '<div class="atomic-row"><div class="atomic-box master">Master Creative</div></div>';
    html += '<div class="atomic-arrow">&#8595;</div>';
    html += '<div class="atomic-row">';
    ['Text', 'Image', 'Logo', 'BG'].forEach(function(c) {
      html += '<div class="atomic-box component">' + c + '</div>';
    });
    html += '</div>';
    html += '<div class="atomic-arrow">&#8595;</div>';
    html += '<div class="atomic-row">';
    ['Email', 'DV360', 'On-site', 'Meta'].forEach(function(c) {
      html += '<div class="atomic-box channel">' + c + '</div>';
    });
    html += '</div>';
    html += '<div class="atomic-arrow">&#8595;</div>';
    html += '<div class="atomic-row"><div class="atomic-box variants">18 Ad Variants</div></div>';
    html += '</div>';
    html += '</div>';
  }

  // Activation dashboard
  if (state.atomicVisible) {
    html += '<div class="act-section">';
    html += '<div class="act-section-title">Activate to Channels</div>';

    const channels = [
      { id: 'email',     label: 'Email',            count: 1  },
      { id: 'dv360',     label: 'DV360',             count: 3  },
      { id: 'ttd',       label: 'The Trade Desk',    count: 3  },
      { id: 'onsite',    label: 'HD On-site',        count: 11 },
      { id: 'meta',      label: 'Meta / Facebook',   count: 3  },
      { id: 'pinterest', label: 'Pinterest',         count: 1  }
    ];

    channels.forEach(function(ch) {
      html += '<label class="act-channel-row">';
      html += '<input type="checkbox" checked> ';
      html += '<span class="act-channel-name">' + esc(ch.label) + '</span>';
      html += '<span class="act-channel-count">(' + ch.count + ' size' + (ch.count > 1 ? 's' : '') + ')</span>';
      html += '</label>';
    });

    html += '<div class="date-row">';
    html += '<div class="date-col"><div class="date-label">Start</div><input class="date-input" type="date" value="' + todayStr() + '"></div>';
    html += '<div class="date-col"><div class="date-label">End</div><input class="date-input" type="date" value="' + plus30() + '"></div>';
    html += '</div>';

    if (state.activatedChannels.length > 0) {
      html += '<div class="activated-banner">&#10003; Creative Activated &mdash; Live in ~2 hours</div>';
    } else {
      html += '<button class="activate-btn" onclick="activateChannels()">Activate to 6 Channels &rarr;</button>';
    }

    html += '</div>';
  }

  panel.innerHTML = html;
}

function toggleManualCheck(subId, checkId, val) {
  if (!state.manualChecks[subId]) state.manualChecks[subId] = {};
  state.manualChecks[subId][checkId] = val;
}

function toggleChangesPanel(id) {
  state.changesOpen = !state.changesOpen;
  state.rejectOpen = false;
  renderActionsPanel();
}

function toggleRejectPanel(id) {
  state.rejectOpen = !state.rejectOpen;
  state.changesOpen = false;
  renderActionsPanel();
}

function toggleTag(tag) {
  if (state.changeTags.includes(tag)) {
    state.changeTags = state.changeTags.filter(t => t !== tag);
  } else {
    state.changeTags.push(tag);
  }
  renderActionsPanel();
}

// ─────────────────────────────────────────────
//  INIT
// ─────────────────────────────────────────────

renderAll();

</script>
</body>
</html>
